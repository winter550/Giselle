*{box-sizing:border-box} body{margin:0;background:var(--ui-bg);color:var(--ui-text);font-family:var(--font);font-weight:300}
.app{display:grid;grid-template-columns:360px 1fr;gap:22px;min-height:100vh;padding:22px}.panel{background:var(--ui-card);border:1px solid var(--ui-line);border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(20,30,50,.05);height:calc(100vh - 44px);overflow:auto}.panel h1{font-size:18px;margin:0 0 14px;font-weight:600;letter-spacing:-.02em}.group{border-top:1px solid #edf0f5;padding-top:14px;margin-top:14px}.label{display:block;font-size:12px;color:var(--ui-sub);font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:0 0 7px}select,input[type="text"],input[type="color"],textarea{width:100%;border:1px solid var(--ui-line);border-radius:10px;background:#fff;padding:10px 11px;font-family:inherit;font-size:14px;color:var(--ui-text)}textarea{min-height:70px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row.three{grid-template-columns:1fr 1fr 1fr}.btns{display:flex;flex-wrap:wrap;gap:10px 12px}.btn,.chipBtn{border:1px solid var(--ui-line);background:#fff;border-radius:999px;padding:8px 12px;font-size:12px;color:#536072;cursor:pointer;font-family:inherit}.btn:hover,.chipBtn:hover{border-color:var(--accent)}.chipBtn.active{background:var(--select);border-color:var(--select);color:var(--selectText);box-shadow:0 4px 10px rgba(59,130,246,.22)}.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.toolbar button{height:30px;border:1px solid var(--ui-line);background:#fff;border-radius:8px;padding:0 9px;cursor:pointer}.toolbar input[type=color]{width:38px;height:30px;padding:2px;border-radius:8px}.editable{min-height:38px;border:1px solid var(--ui-line);background:#fff;border-radius:10px;padding:9px 10px;font-size:14px;line-height:1.45;outline:none}

/* white / dark shared */
.theme-white,.theme-dark{--text:#1f2937;--muted:#7a8392;--slot:#eef2f7;--slotLine:#cfd8e6;--chipLine:#c7d1df;background:var(--paper);padding:40px 46px}.theme-white{--paper:#fbfcff;--line:#d6deeb}.theme-dark{--paper:#111827;--text:#f4f6fb;--muted:#9aa5b8;--line:#334155;--slot:#1e293b;--slotLine:#475569;--chipLine:#475569;color:#f4f6fb}.theme-white .body,.theme-dark .body{display:grid;grid-template-columns:150px 1fr 286px;gap:28px;height:100%}.theme-white .leftRail,.theme-dark .leftRail{display:flex;flex-direction:column;gap:14px;padding-top:12px}.theme-white .content,.theme-dark .content{display:flex;flex-direction:column;gap:14px;min-width:0;padding-top:12px}.theme-white .topline,.theme-dark .topline{height:1px;background:var(--line);margin-bottom:2px}.theme-white .favStrip,.theme-dark .favStrip{align-self:start;padding-top:6px}.theme-white .favGrid,.theme-dark .favGrid{grid-template-columns:1fr 1fr}.theme-white .fav,.theme-dark .fav{height:128px}

/* boarding */
.theme-boarding{--text:#263143;--muted:#7b8492;--slot:#eaf0f8;--slotLine:#c9d3e4;--chipLine:#c7d1df;background:#f8fbff;border:1px solid #cbd6e6;color:#263143}.theme-boarding .ticketTop{height:66px;background:#173f72;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 38px;font-weight:700;letter-spacing:.22em;font-size:16px}.theme-boarding .ticketBody{display:grid;grid-template-columns:1fr 330px;height:519px}.theme-boarding .ticketMain{display:grid;grid-template-columns:140px 1fr;gap:30px;padding:34px 28px 30px 38px}.theme-boarding .ticketStub{border-left:2px dashed #bfcaDC;padding:30px 34px;display:flex;flex-direction:column;gap:14px}.theme-boarding .name{font-size:43px}.theme-boarding .favGrid{grid-template-columns:1fr 1fr}.theme-boarding .fav{height:132px;border-radius:12px;border-width:1px}.theme-boarding .stubCode{margin-top:auto;font-size:11px;letter-spacing:.2em;color:#97a3b4;font-weight:700}.theme-boarding .infoGrid{grid-template-columns:110px 1fr;gap:14px 18px}.theme-boarding .avatar{margin-top:2px}

.theme-system{--text:#c8ffd6;--muted:#72c987;--slot:#06140b;--slotLine:#1d7c3b;--chipLine:#1d7c3b;background:#020704;color:#c8ffd6;padding:30px 34px;font-family:var(--font)}.theme-system:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 4px);pointer-events:none}.theme-system .sysTop{display:flex;justify-content:space-between;border-bottom:1px solid #1d7c3b;padding-bottom:10px;margin-bottom:22px;color:#7cff9d;font-size:12px;letter-spacing:.18em}.theme-system .body{display:grid;grid-template-columns:1fr 270px;gap:24px}.theme-system .avatar{border-radius:4px}.theme-system .top{display:grid;grid-template-columns:118px 1fr;gap:22px}.theme-system .name{font-size:34px;letter-spacing:0}.theme-system .favGrid{grid-template-columns:1fr 1fr}.theme-system .fav{height:104px;border-radius:4px}.theme-system .right{border-left:1px solid #1d7c3b;padding-left:22px}.theme-system .pill{border-radius:3px}.theme-system .infoGrid{grid-template-columns:116px 1fr;gap:16px 18px}

.theme-win{--text:#111827;--muted:#374151;--slot:#ffffff;--slotLine:#808080;--chipLine:#808080;background:#008080;color:#111827;padding:22px;font-family:var(--font)}.theme-win .window{height:100%;background:#c0c0c0;border:2px solid #fff;box-shadow:inset -2px -2px #808080,inset 2px 2px #dfdfdf;display:flex;flex-direction:column}.theme-win .titlebar{height:30px;background:linear-gradient(90deg,#000080,#1084d0);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:13px;font-weight:700}.theme-win .winBtns{display:flex;gap:4px}.theme-win .winBtns span{width:18px;height:16px;background:#c0c0c0;border:1px solid #fff;box-shadow:inset -1px -1px #808080;color:#111;font-size:10px;text-align:center;line-height:14px}.theme-win .winBody{display:grid;grid-template-columns:1fr 260px;gap:12px;padding:14px;height:100%;min-height:0}.theme-win .main{background:#fff;border:2px inset #c0c0c0;padding:18px;display:grid;grid-template-columns:112px 1fr;gap:18px}.theme-win .side{background:#e6e6e6;border:2px inset #c0c0c0;padding:12px}.theme-win .favGrid{grid-template-columns:1fr 1fr}.theme-win .fav{height:104px;border-radius:0}.theme-win .avatar{border-radius:0}.theme-win .name{font-size:33px}.theme-win .infoGrid{grid-template-columns:108px 1fr;gap:16px 18px}.theme-win .pill{border-radius:0;background:#eee;box-shadow:inset -1px -1px #999,inset 1px 1px #fff}

<script>
const fields=['nickname','userid','bio','platform','ng','triggerText','other','boardingGate','boardingSeat','boardingClass','boardingPassId'];
const imageKeys=['avatar','fav1','fav2','fav3','fav4'];
const imgState={}; imageKeys.forEach(k=>imgState[k]={src:'',scale:1,x:0,y:0});
let activeEditable=null;
let savedRange=null;
document.addEventListener('focusin',e=>{if(e.target.classList.contains('editable')) activeEditable=e.target});
document.addEventListener('selectionchange',()=>{
  const sel=window.getSelection();
  if(!sel || sel.rangeCount===0) return;
  const node=sel.anchorNode;
  const el=node && (node.nodeType===1?node:node.parentElement);
  const editable=el && el.closest ? el.closest('.editable') : null;
  if(editable){ activeEditable=editable; savedRange=sel.getRangeAt(0).cloneRange(); }
});

// Force pasted content to plain text only. This prevents copied colors, highlights, formulas, links, and outside styles from entering fields.
function insertPlainTextIntoEditable(target, text){
  activeEditable=target;
  target.focus();
  restoreSelection();
  try{ document.execCommand('insertText', false, text); }
  catch(err){
    const sel=window.getSelection();
    if(sel && sel.rangeCount){
      sel.deleteFromDocument();
      const node=document.createTextNode(text);
      sel.getRangeAt(0).insertNode(node);
      sel.removeAllRanges();
      const r=document.createRange();
      r.setStartAfter(node); r.collapse(true); sel.addRange(r);
    }
  }
  rememberSelection();
  render();
}
document.addEventListener('paste', e=>{
  const target=e.target && e.target.closest ? e.target.closest('.editable') : null;
  if(!target) return;
  e.preventDefault();
  const text=(e.clipboardData || window.clipboardData).getData('text/plain') || '';
  insertPlainTextIntoEditable(target, text);
});
document.addEventListener('beforeinput', e=>{
  const target=e.target && e.target.closest ? e.target.closest('.editable') : null;
  if(!target || e.inputType!=='insertFromPaste') return;
  if(e.dataTransfer){
    e.preventDefault();
    insertPlainTextIntoEditable(target, e.dataTransfer.getData('text/plain') || '');
  }
});

// Do not let toolbar buttons steal the selected text range. Color inputs are left clickable so the picker opens smoothly.
document.addEventListener('mousedown', e=>{
  const toolbar=e.target.closest && e.target.closest('.toolbar');
  if(!toolbar) return;
  rememberSelection();
  if(e.target.tagName !== 'INPUT') e.preventDefault();
});

function rememberSelection(){
  const sel=window.getSelection();
  if(sel && sel.rangeCount) savedRange=sel.getRangeAt(0).cloneRange();
}
function restoreSelection(){
  if(!activeEditable) return false;
  activeEditable.focus();
  const sel=window.getSelection();
  if(savedRange && sel){ sel.removeAllRanges(); sel.addRange(savedRange); return true; }
  return false;
}
function cmd(c){
  if(!activeEditable) return;
  restoreSelection();
  try{document.execCommand('styleWithCSS',false,false);}catch(e){}
  try{ document.execCommand(c,false,null); }catch(e){}
  rememberSelection();
  render();
}
function cmdColor(c,v){

  try{document.execCommand('styleWithCSS',false,true);}catch(e){}
  let ok=false;

}

function unwrapNodeKeepChildren(node){
  const parent=node.parentNode;
  if(!parent) return;
  while(node.firstChild) parent.insertBefore(node.firstChild,node);
  parent.removeChild(node);
}
function cleanEmptyInlineStyles(root){
  if(!root) return;
  root.querySelectorAll('span,font,b,strong,i,em,u,s,strike').forEach(el=>{
    if(el.tagName==='SPAN' || el.tagName==='FONT'){
      el.removeAttribute('style');
      el.removeAttribute('color');
      el.removeAttribute('face');
      el.removeAttribute('size');
      unwrapNodeKeepChildren(el);
    }
  });
}
function clearFormat(){
  if(!activeEditable) return;
  restoreSelection();
  try{document.execCommand('styleWithCSS',false,false);}catch(e){}
  try{document.execCommand('removeFormat',false,null);}catch(e){}
  try{document.execCommand('foreColor',false,'inherit');}catch(e){}
  try{document.execCommand('hiliteColor',false,'transparent');}catch(e){try{document.execCommand('backColor',false,'transparent');}catch(_){}}
  // removeFormat leaves browser-created spans/fonts in some cases, especially color/highlight.
  // Clean only the current editable box so other fields stay untouched.
  cleanEmptyInlineStyles(activeEditable);
  rememberSelection();
  render();

function html(id){const el=document.getElementById(id); const t=(el.innerHTML||'').replace(/<br\s*\/?>(\s*)?/gi,'').trim(); return t?el.innerHTML:''}

function imgSlot(key,cls='fav'){
  const st=imgState[key];
  const src=st.src?`<img class="slotImg" src="${st.src}" data-key="${key}" alt="" draggable="false" loading="eager" decoding="async">`:'';
  return `<div class="${cls} ${st.src?'hasImg':''}" data-slot="${key}">${src}<div class="slotText">${key==='avatar'?'ICON':''}</div></div>`
}

function applySlotImageSizing(root=document){
  root.querySelectorAll('[data-slot]').forEach(slot=>{
    const img=slot.querySelector('img.slotImg');
    if(!img) return;
    const key=slot.dataset.slot;
    const st=imgState[key] || {scale:1,x:0,y:0};
    const fit=()=>{
      const sw=slot.clientWidth || slot.getBoundingClientRect().width;
      const sh=slot.clientHeight || slot.getBoundingClientRect().height;
      const nw=img.naturalWidth || 1;
      const nh=img.naturalHeight || 1;
      if(!sw || !sh || !nw || !nh) return;
      const slotRatio=sw/sh;
      const imgRatio=nw/nh;
      let w,h;
      if(slotRatio > imgRatio){ h=sh; w=h*imgRatio; }
      else { w=sw; h=w/imgRatio; }
      const scale=Math.max(0.2, Number(st.scale)||1);
      w*=scale; h*=scale;
      img.style.width=w+'px';
      img.style.height=h+'px';
      img.style.left=`calc(50% + ${(Number(st.x)||0)}px)`;
      img.style.top=`calc(50% + ${(Number(st.y)||0)}px)`;
      img.style.transform='translate(-50%,-50%)';
      img.style.objectFit='fill';
    };
    if(img.complete && img.naturalWidth) fit();
    else img.onload=fit;
  });
}

function boarding(){const gate=html('boardingGate'), seat=html('boardingSeat'), cls=html('boardingClass'), pass=html('boardingPassId'); return `<div class="ticketTop"><div class="boardingTitle">BOARDING PASS</div><div class="topRight">FLIGHT TW-001</div></div><div class="ticketBody"><div class="ticketMain"><div>${imgSlot('avatar','avatar')}</div><div class="boardingInfo"><div class="boardingRows"><div><span>PASSENGER NAME</span><b>${html('nickname')}</b></div><div><span>CALLSIGN</span><b>${html('userid')}</b></div><div class="boardingMemo"><span>MEMO</span><b>${html('bio')}</b></div></div><div class="flightMeta"><div class="${gate?'':'emptyMeta'}">GATE<b>${gate}</b></div><div class="${seat?'':'emptyMeta'}">SEAT<b>${seat}</b></div><div class="${cls?'':'emptyMeta'}">CLASS<b>${cls}</b></div></div>${info()}</div></div><aside class="ticketStub"><div class="passIdBox ${pass?'':'emptyMeta'}"><div class="miniLabel">PASS ID</div><div class="passId">${pass}</div></div>${favGrid()}<div class="barcode"></div><div class="stubCode">PRIORITY · PROFILE PASS</div><div class="boardingHint">BOARDING GATE CLOSE 20 MINUTES PRIOR</div></aside></div>`}
function playlist(){return `<div class="player"><div class="playMain"><div class="now">NOW PLAYING...</div><div class="playerMeta"><span>TRACK 01</span><span>LOOP ON</span></div><div class="top">${imgSlot('avatar','avatar')}<div class="trackMain"><div class="name">${html('nickname')}</div><div class="id">${html('userid')}</div><div class="bio lyricLine">${html('bio')}</div><div class="bar"></div><div class="timeRow"><span>01:37</span><span>03:42</span></div><div class="controls">▶ ❚❚ ⏭</div></div></div>${info()}<div class="eqLine">▁▃▆▇▅▂▁</div></div><aside class="favSide"><div class="trackInfo">QUEUE<br>FAVORITES<br>LOOP ON</div>${favGrid()}<div class="recentTracks"><div>RECENTLY PLAYED</div><span>▶ track_01</span><span>▶ track_02</span><span>▶ track_03</span></div></aside></div>`}
function system(kind){const isHud=kind==='hud'; if(isHud){return `<div class="hudDecor"><span class="hudLine l1"></span><span class="hudLine l2"></span><span class="hudLine l3"></span><span class="hudLine l4"></span></div><div class="hudTop"><span><b class="hudTitle">PROBABILITY INDEX</b></span><span>SUCCESS 99.87%</span></div><div class="body"><div><div class="top">${imgSlot('avatar','avatar')}<div><div class="name">${html('nickname')}</div><div class="id">${html('userid')}</div><div class="bio">${html('bio')}</div></div></div><br>${info()}</div><aside class="right">${favGrid()}<div class="probPanel"><div class="probTitle">OUTCOME RATE</div><div class="probRow"><span>SUCCESS</span><b>99.87%</b></div><div class="probRow"><span>FAILURE</span><b>0.13%</b></div><div class="probRow"><span>TIME</span><b>00.83s</b></div><div class="probRow"><span>ERROR</span><b>0.02%</b></div></div></aside></div>`;} return `<div class="sysDecor"></div><div class="sysTop"><span>STATUS : RUNNING</span><span>ACCESS : VERIFIED</span></div><div class="body"><div><div class="top">${imgSlot('avatar','avatar')}<div><div class="name">${html('nickname')}</div><div class="id">${html('userid')}</div><div class="bio">${html('bio')}</div></div></div><br>${info()}</div><aside class="right"><div class="sysBadge"><span>AUTH OK</span><span>TRACE OK</span></div>${favGrid()}<div class="tracePanel"><div class="traceTitle">TRACE LOG</div><div>&gt; PROFILE LOADED</div><div>&gt; DATA LINKED</div><div>&gt; ROUTE CLEAR</div><div>&gt; SYNC COMPLETE</div></div><div class="sysCheck">SYSTEM CHECK : OK</div></aside></div>`}
function win(){return `<div class="window"><div class="titlebar"><span>profile_viewer.exe</span><div class="winBtns"><span>_</span><span>□</span><span>×</span></div></div><div class="winBody"><div class="main">${imgSlot('avatar','avatar')}<div><div class="name">${html('nickname')}</div><div class="id">${html('userid')}</div><div class="bio">${html('bio')}</div>${info()}</div></div><aside class="side">${favGrid()}</aside></div></div>`}
function applyTextSizes(){['name','id','bio','body'].forEach(k=>{const el=document.getElementById(k+'Size'); const val=document.getElementById(k+'SizeVal'); if(!el) return; document.documentElement.style.setProperty('--'+k+'Size', el.value+'px'); if(val) val.textContent=el.value+'px';});}
function mac(){return `<div class="finder"><div class="topbar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="fileName">Profile Archive</span></div><div class="body"><aside class="sidebar"><div>Profile</div><div>Favorites</div><div>NG.txt</div><div>Other.txt</div></aside><main class="main">${imgSlot('avatar','avatar')}<div><div class="name">${html('nickname')}</div><div class="id">${html('userid')}</div><div class="bio">${html('bio')}</div>${info()}</div></main><aside class="side">${favGrid()}</aside></div></div>`}
function render(){const card=document.getElementById('card'); const th=document.getElementById('theme').value; const align=document.getElementById('align').value; document.documentElement.style.setProperty('--font',document.getElementById('font').value); document.documentElement.style.setProperty('--select',document.getElementById('selectColor').value); document.documentElement.style.setProperty('--selectText',document.getElementById('selectTextColor').value); document.documentElement.style.setProperty('--userAlign',align==='justify'?'justify':align); applyTextSizes(); card.className='canvas theme-'+th+(align==='justify'?' align-justify':''); card.style.textAlign='left'; if(th==='white'||th==='dark') card.innerHTML=baseProfile(); else if(th==='boarding') card.innerHTML=boarding(); else if(th==='playlist') card.innerHTML=playlist(); else if(th==='system') card.innerHTML=system('system'); else if(th==='hud') card.innerHTML=system('hud'); else if(th==='win') card.innerHTML=win(); else if(th==='mac') card.innerHTML=mac(); applySlotImageSizing(card); requestAnimationFrame(()=>applySlotImageSizing(card)); fitPreview();}
function buildImageControls(){
  const root=document.getElementById('imageControls');
  const names={avatar:'인장',fav1:'Favorite 1',fav2:'Favorite 2',fav3:'Favorite 3',fav4:'Favorite 4'};
  root.innerHTML=imageKeys.map(k=>`<div class="imageControl"><label class="label">${names[k]}</label><input type="file" accept="image/*" data-img="${k}"><div class="rangeRow"><span>확대</span><input type="range" min="0.5" max="4" step="0.01" value="1" data-prop="scale" data-img="${k}"></div><div class="rangeRow"><span>좌우</span><input type="range" min="-180" max="180" step="1" value="0" data-prop="x" data-img="${k}"></div><div class="rangeRow"><span>상하</span><input type="range" min="-180" max="180" step="1" value="0" data-prop="y" data-img="${k}"></div></div>`).join('');
  root.querySelectorAll('input[type=file]').forEach(inp=>inp.addEventListener('change',e=>{
    const file=e.target.files[0]; if(!file) return;
    const key=e.target.dataset.img;
    const r=new FileReader();
    r.onload=ev=>{
      const data=ev.target.result;
      const probe=new Image();
      probe.onload=()=>{
        imgState[key]={src:data,scale:1,x:0,y:0};
        const box=e.target.closest('.imageControl');
        if(box){
          box.querySelector('[data-prop="scale"]').value=1;
          box.querySelector('[data-prop="x"]').value=0;
          box.querySelector('[data-prop="y"]').value=0;
        }
        render();
      };
      probe.onerror=()=>{ imgState[key]={src:data,scale:1,x:0,y:0}; render(); };
      probe.src=data;
    };
    r.readAsDataURL(file);
  }));
  root.querySelectorAll('input[type=range]').forEach(inp=>inp.addEventListener('input',e=>{
    const k=e.target.dataset.img,p=e.target.dataset.prop;
    imgState[k][p]=Number(e.target.value);
    render();
  }));
}
document.querySelectorAll('.chipBtn').forEach(b=>b.addEventListener('click',()=>{b.classList.toggle('active');render()}));
['theme','font','selectColor','selectTextColor','align','showTrigger','showTime','nameSize','idSize','bioSize','bodySize'].forEach(id=>document.getElementById(id).addEventListener('input',render)); fields.forEach(id=>document.getElementById(id).addEventListener('input',render));
async function waitForImages(root){
  const imgs=[...root.querySelectorAll('img')];
  await Promise.all(imgs.map(img=>new Promise(resolve=>{
    const done=()=>resolve();
    if(img.complete && img.naturalWidth){
      if(img.decode) img.decode().then(done).catch(done); else done();
    }else{
      img.onload=()=>{ if(img.decode) img.decode().then(done).catch(done); else done(); };
      img.onerror=done;
    }
  })));
  if(document.fonts && document.fonts.ready) await document.fonts.ready;
}
async function savePNG(){
  try{
    const source=document.getElementById('card');
    const clone=source.cloneNode(true);
    clone.style.transform='none';
    clone.style.position='relative';
    clone.style.left='0'; clone.style.top='0';
    clone.style.width='1100px';
    clone.style.minHeight='700px';
    clone.style.height='auto';
    clone.style.overflow='visible';

    const holder=document.createElement('div');
    holder.style.position='fixed';
    holder.style.left='-20000px';
    holder.style.top='0';
    holder.style.width='1100px';
    holder.style.minHeight='700px';
    holder.style.height='auto';
    holder.style.overflow='visible';
    holder.appendChild(clone);
    document.body.appendChild(holder);

    await waitForImages(clone);
    applySlotImageSizing(clone);
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));

    const exportHeight=Math.ceil(Math.max(700, clone.scrollHeight, clone.offsetHeight, clone.getBoundingClientRect().height));
    holder.style.height=exportHeight+'px';
    clone.style.minHeight=exportHeight+'px';

    const canvas=await html2canvas(clone,{
      scale:3,
      useCORS:true,
      allowTaint:true,
      backgroundColor:null,
      width:1100,
      height:exportHeight,
      windowWidth:1100,
      windowHeight:exportHeight,
      scrollX:0,
      scrollY:0,
      foreignObjectRendering:false,
      imageTimeout:0,
      logging:false
    });
    const ctx=canvas.getContext('2d');
    if(ctx){ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';}
    holder.remove();
    const a=document.createElement('a');
    a.href=canvas.toDataURL('image/png');
    a.download='twitter-bio-profile.png';
    a.click();
  }catch(err){
    console.error(err);
    alert('PNG 저장 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
  }
}
function fitPreview(){
  const wrap=document.getElementById('previewWrap'), box=document.getElementById('scaleBox'), card=document.getElementById('card');
  if(!wrap||!box) return;
  const baseW=1100;
  const measuredH=card ? Math.ceil(Math.max(700, card.scrollHeight, card.offsetHeight, card.getBoundingClientRect().height)) : 700;
  const baseH=measuredH;
  const isMobile=window.matchMedia('(max-width: 980px)').matches;
  const pad=isMobile?20:36;
  const availableW=Math.max(280, wrap.clientWidth-pad);
  const maxH=isMobile?Math.max(230, window.innerHeight*0.42-24):Math.max(420, window.innerHeight-80);
  const scale=Math.min(1, availableW/baseW, maxH/baseH);
  box.style.width=baseW+'px';
  box.style.height=(baseH*scale)+'px';
  box.style.transform=`scale(${scale})`;
  box.style.transformOrigin='top center';
}
window.addEventListener('resize', ()=>{fitPreview(); applySlotImageSizing(document.getElementById('card'));});
window.addEventListener('orientationchange', ()=>setTimeout(fitPreview,150));
buildImageControls(); render(); fitPreview();
