async function makeBlob(){

      }
    }
    if(!window.html2canvas) throw new Error('PNG 저장 라이브러리를 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요.');

      allowTaint:true,
      logging:false,
      removeContainer:true,
      foreignObjectRendering:false,
      letterRendering:false,
      imageTimeout:0,
      windowWidth:Math.max(document.documentElement.clientWidth, width),
      windowHeight:Math.max(document.documentElement.clientHeight, height)
    });
    return await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('PNG 변환에 실패했습니다.')),'image/png'));
  });
}
async function makeCanvas(){
  const blob = await makeBlob();
  const url = URL.createObjectURL(blob);
  try{
    const img = new Image();
    img.decoding='async';
    await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url;});
    const canvas=document.createElement('canvas');
    canvas.width=img.naturalWidth;
    canvas.height=img.naturalHeight;
    const ctx=canvas.getContext('2d');
    ctx.drawImage(img,0,0);
    return canvas;
  }finally{
    URL.revokeObjectURL(url);
  }
}

      a.href=url;
      a.download='message-maker.png';
      a.rel='noopener';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
      show('PNG 저장 완료');
    }catch(e){
      console.error('PNG save failed', e);
      try{
        const blob=await renderBlob();
        const url=URL.createObjectURL(blob);
        window.open(url,'_blank');
        setTimeout(()=>URL.revokeObjectURL(url),10000);
        show('다운로드가 막혀 새 창으로 열었습니다. 길게 눌러 저장해 주세요.');
      }catch(e2){
        console.error('PNG fallback failed', e2);
        show((e&&e.message)||'PNG 저장 실패');
      }
    }finally{
      btns.forEach(b=>{ b.disabled=false; b.textContent=b.dataset.oldText || 'PNG 저장'; });
    }
  }
  async function copyPNG(){
    try{
      const blob=await renderBlob();
      await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
      show('이미지 복사 완료');
    }catch(e){
      console.error(e);
      show('이미지 복사가 제한되어 있습니다');
    }
  }
  const s1=byId('saveBtn'), s2=byId('saveBtnMobile');
  if(s1) s1.onclick=downloadPNG;
  if(s2) s2.onclick=downloadPNG;
  const c1=byId('copyImg'), c2=byId('copyImgMobile');
  if(c1) c1.onclick=copyPNG;
  if(c2) c2.onclick=copyPNG;
})();

</script>
</body>
</html>
