<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timeline Maker</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/static/woff2/SUIT.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans/packages/wanted-sans/dist/static/complete/WantedSans.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ui1:#ff91bd;--ui2:#c7b5ff;--ink:#3d3540;--line:#efd9e6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fff8fb,#fff1dc);font-family:Pretendard,"Noto Sans KR",sans-serif;color:var(--ink)}
.wrap{width:min(1340px,calc(100% - 28px));margin:auto;padding:32px 0 56px}
h1{margin:0 0 22px;font-size:clamp(30px,5vw,52px);letter-spacing:-.06em;line-height:.95}
.grid{display:grid;grid-template-columns:430px 1fr;gap:22px;align-items:start}
.panel{background:#fffafc;border:1px solid #f0dce8;border-radius:30px;box-shadow:0 18px 48px rgba(153,90,128,.13)}
.editor{padding:22px;position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto}
.preview{padding:22px;position:relative}
.preview-top{display:flex;justify-content:flex-end;margin-bottom:16px}
.section{font-weight:950;color:#735669;font-size:14px;margin:4px 0 12px}
.field{margin-bottom:12px}
label{display:block;font-size:12px;font-weight:950;color:#9a8292;margin:0 0 7px 2px}
input,textarea,select{width:100%;border:1px solid var(--line);background:#fff;border-radius:16px;padding:12px 13px;font:inherit;font-size:14px;color:var(--ink);outline:none}
textarea{min-height:130px;resize:vertical;line-height:1.55}
input:focus,textarea:focus,select:focus{border-color:var(--ui1);box-shadow:0 0 0 4px rgba(255,159,200,.18)}
input[type=range]{padding:0;accent-color:var(--ui1)}
input[type=color]{height:42px;padding:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.textbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px;border-radius:22px;background:#fff;border:1px solid var(--line);margin-bottom:16px}
.full{grid-column:1/-1}
.range-line{display:flex;align-items:center;gap:10px}
.range-value{min-width:38px;text-align:right;font-size:12px;font-weight:900;color:#9a8292}
button{border:0;border-radius:16px;padding:12px 14px;font:inherit;font-weight:950;color:#fff;background:linear-gradient(135deg,var(--ui1),var(--ui2));box-shadow:0 12px 24px rgba(190,118,170,.24);cursor:pointer}
.save{min-width:138px;background:linear-gradient(135deg,#ff8eba,#ffbd90)}
.event-editor{padding:4px 0 18px;margin-bottom:18px;border-bottom:1px dashed rgba(190,150,175,.45)}
.event-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.head-left{display:flex;align-items:center;gap:9px;font-weight:950}
.num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ffe4f0,#fff3d7);color:#c7669a;font-weight:950;font-size:13px}
.tiny{width:auto;padding:8px 10px;border-radius:999px;background:#fff;color:#b67b9c;border:1px solid #f0dce8;box-shadow:none;font-size:12px}

/* CARD */
#card{
  --font:Pretendard,"Noto Sans KR",sans-serif;
  --a:#ff91bd;--b:#ffc0a8;--c:#c7b5ff;
  --cardText:#3d3540;--subText:#756370;
  --box:#fff;--boxBorder:#f6d9e8;
  --tagBg:#fff1f7;--tagText:#b96a94;
  --chipBg:#fff8df;--chipText:#9c744d;
  --dash:#eecce0;
  width:min(100%,900px);
  margin:0 auto;
  border-radius:38px;
  padding:42px;
  position:relative;
  overflow:hidden;
  border:1px solid var(--boxBorder);
  box-shadow:0 24px 60px rgba(120,75,110,.13);
  background:linear-gradient(180deg,#fffefd,#fff7fb);
  color:var(--cardText);
  font-size:16px;
  font-family:var(--font)!important;
}
#card,#card *{font-family:var(--font)!important}
#card:before{content:"";position:absolute;inset:16px;border:1px dashed var(--dash);border-radius:29px;pointer-events:none}
.card-inner{position:relative;z-index:1}
.tag{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--tagBg);border:1px solid var(--boxBorder);font-size:.72em;font-weight:950;letter-spacing:.13em;text-transform:uppercase;color:var(--tagText)}
.card-title{margin:14px 0 6px;font-size:2.25em;line-height:1.04;letter-spacing:-.06em;color:var(--cardText)}
.card-sub{margin:0 0 36px;color:var(--subText);font-size:.9em;font-weight:750}

/* Common timeline */
.timeline{position:relative}
.tline{position:absolute;border-radius:99px;background:linear-gradient(180deg,var(--a),var(--b),var(--c));z-index:0}
.titem{position:relative;z-index:1}
.dot{width:42px;height:42px;border-radius:50%;background:var(--box);border:3px solid var(--a);display:grid;place-items:center;color:var(--tagText);font-size:.78em;font-weight:950;z-index:3}
.arm{position:absolute;width:28px;height:2px;display:none;z-index:2;top:20px}
.titem.has .arm{display:block}
.content{min-width:0;overflow-wrap:anywhere;word-break:break-word}
.when{display:inline-flex;max-width:100%;padding:6px 10px;border-radius:999px;background:var(--tagBg);border:1px solid var(--boxBorder);color:var(--tagText);font-size:.78em;font-weight:950;margin-bottom:9px;overflow-wrap:anywhere;word-break:break-word}
.what{margin:0 0 8px;font-size:1.23em;letter-spacing:-.04em;line-height:1.2;color:var(--cardText);overflow-wrap:anywhere;word-break:break-word}
.memo{margin:0;color:var(--subText);font-size:.92em;line-height:var(--lineHeight,1.7);white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip{padding:6px 9px;border-radius:999px;background:var(--chipBg);color:var(--chipText);font-size:.72em;font-weight:900;overflow-wrap:anywhere;word-break:break-word}

/* Branch: first left, second right */
.layout-branch .timeline{display:grid;padding:0 10px;overflow:visible}
.layout-branch .tline{left:50%;top:21px;bottom:21px;width:3px;transform:translateX(-50%)}
.layout-branch .titem{display:grid;grid-template-columns:minmax(0,1fr) 58px minmax(0,1fr);align-items:start;padding-bottom:34px}
.layout-branch .titem:last-child{padding-bottom:0}
.layout-branch .dot{grid-column:2;justify-self:center}
.layout-branch .content{max-width:310px}
.layout-branch .titem.left .content{grid-column:1;justify-self:end;text-align:right;padding-right:22px}
.layout-branch .titem.right .content{grid-column:3;justify-self:start;text-align:left;padding-left:22px}
.layout-branch .titem.left .arm{left:calc(50% - 57px);background:linear-gradient(to left,var(--a),transparent)}
.layout-branch .titem.right .arm{left:calc(50% + 29px);background:linear-gradient(to right,var(--a),transparent)}
.layout-branch .titem.left .meta{justify-content:flex-end}
.layout-branch .titem.right .meta{justify-content:flex-start}

/* Vertical */
.layout-vertical .timeline{display:grid;overflow:visible;padding:28px 0 28px 18px}
.layout-vertical .tline{left:52px;top:28px;bottom:28px;width:3px}
.layout-vertical .titem{display:grid;grid-template-columns:68px minmax(0,1fr);gap:14px;align-items:start;padding-bottom:34px}
.layout-vertical .titem:last-child{padding-bottom:0}
.layout-vertical .dot{grid-column:1;justify-self:center}
.layout-vertical .content{grid-column:2;justify-self:start;text-align:left;max-width:640px;padding:0}
.layout-vertical .arm{left:54px;width:22px;background:linear-gradient(to right,var(--a),transparent)!important}
.layout-vertical .meta{justify-content:flex-start}

/* Horizontal */
.layout-horizontal{width:min(100%,1100px)!important}
.layout-horizontal .timeline{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 24px;padding:54px 0 18px;align-items:start;overflow:visible}
.layout-horizontal .tline,.layout-horizontal .arm{display:none!important}
.layout-horizontal .titem{display:grid;grid-template-rows:52px auto;justify-items:center;align-items:start;gap:10px;padding:0;text-align:center}
.layout-horizontal .dot{grid-row:1;justify-self:center;margin:0}
.layout-horizontal .content{grid-row:2;width:100%;max-width:none;text-align:center;padding:0}
.layout-horizontal .meta{justify-content:center}

/* Themes */
#card.theme-sky{--a:#8fdcff;--b:#d9f4ff;--c:#b8ecff;--cardText:#2f5366;--subText:#63889a;--boxBorder:#cceeff;--tagBg:#eaf8ff;--tagText:#4286aa;--chipBg:#f0fbff;--chipText:#5c91aa;--dash:#cceeff;background:linear-gradient(180deg,#fcffff,#edf9ff)}
#card.theme-paper{--a:#f5bfd5;--b:#ffe8ca;--c:#d7d2ff;--cardText:#493d43;--subText:#8a7980;--boxBorder:#f6d8e5;--tagBg:#fff1f7;--tagText:#bd7692;--chipBg:#fff6de;--chipText:#9b7651;--dash:#f0d5df;background:linear-gradient(180deg,#fffef9,#fff8fc)}
#card.theme-cyber{--a:#7adfff;--b:#9dfff2;--c:#95b5ff;--cardText:#eef9ff;--subText:#bcd3e3;--box:#111d2e;--boxBorder:#28536a;--tagBg:#142a3a;--tagText:#bdecff;--chipBg:#152f33;--chipText:#d2fff7;--dash:#315e76;background:linear-gradient(180deg,#101a2a,#0e1725)}
#card.theme-lavender{--a:#cbb7ff;--b:#efe6ff;--c:#dccfff;--cardText:#51446b;--subText:#82749a;--boxBorder:#e6dcff;--tagBg:#f3ecff;--tagText:#8f77bd;--chipBg:#f7f1ff;--chipText:#826bb4;--dash:#ddd0ff;background:linear-gradient(180deg,#fbf8ff,#f2ecff)}
#card.theme-mint{--a:#bfeec4;--b:#dff8d8;--c:#ecffe7;--cardText:#405c3f;--subText:#75906f;--boxBorder:#d6f6d0;--tagBg:#efffea;--tagText:#6f9f71;--chipBg:#f5fff1;--chipText:#71945e;--dash:#d6f6d0;background:linear-gradient(180deg,#fbfff8,#f2ffef)}
#card.theme-bw{--a:#777;--b:#cfcfcf;--c:#f0f0f0;--cardText:#111;--subText:#555;--boxBorder:#ddd;--tagBg:#f4f4f4;--tagText:#333;--chipBg:#eee;--chipText:#444;--dash:#bbb;background:linear-gradient(180deg,#fff,#efefef)}

/* Export */
#exportArea{position:fixed;left:-10000px;top:0;width:1300px;padding:40px;background:transparent;z-index:-1;pointer-events:none}
#exportArea #card{height:auto!important;min-height:0!important;max-height:none!important;overflow:visible!important}
#exportArea #card.layout-branch{width:920px!important}
#exportArea #card.layout-horizontal{width:1100px!important}

/* Mobile */
@media(max-width:980px){
html,body{height:100%;overflow:hidden}
.wrap{width:100%;height:100dvh;padding:8px;overflow:hidden;display:flex;flex-direction:column}
h1{font-size:24px;margin-bottom:8px}
.grid{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;gap:12px}
.preview{order:1;flex:0 0 auto;padding:10px;border-radius:24px}
.preview-top{position:absolute;top:12px;right:12px;margin:0;z-index:20}
.save{min-width:95px;font-size:13px;padding:10px 14px;border-radius:14px}
#card{width:100%;height:46dvh;min-height:300px;overflow:auto;padding:22px;border-radius:26px;font-size:14px}
#card:before{inset:10px;border-radius:18px}
.card-title{font-size:1.8em;margin:10px 0 4px}.card-sub{margin-bottom:22px}.tag{padding:5px 9px;font-size:.7em}
.editor{order:2;position:relative;top:auto;flex:1;min-height:0;max-height:none;overflow-y:auto;padding:16px;border-radius:26px 26px 0 0}
.row2{grid-template-columns:1fr 1fr;gap:8px}.textbar{grid-template-columns:1fr;padding:12px}
input,textarea,select{font-size:14px;padding:12px;border-radius:14px}textarea{min-height:110px}
.layout-branch .timeline{padding:0}.layout-branch .tline{left:17px;top:18px;bottom:18px;transform:none;width:2px}
.layout-branch .titem{grid-template-columns:42px minmax(0,1fr);gap:12px;padding-bottom:18px}
.layout-branch .dot{grid-column:1;width:34px;height:34px;font-size:.72em}
.layout-branch .titem.left .content,.layout-branch .titem.right .content{grid-column:2;justify-self:start;text-align:left;max-width:none;padding-left:8px;padding-right:0}
.layout-branch .arm{display:none!important}
.layout-horizontal .timeline{grid-template-columns:1fr;padding-top:40px}
.layout-vertical .timeline{padding-left:14px}.layout-vertical .tline{left:45px}.layout-vertical .titem{grid-template-columns:62px minmax(0,1fr)}
}
</style>

<style>
/* 사건 추가 버튼과 사건 편집칸 사이 여백 */
.btns,
.field:has(#add){
  margin-bottom:26px !important;
}
#editors{
  padding-top:8px !important;
}
.event-editor{
  margin-top:8px !important;
}
</style>


<style>
/* 글자 정렬: 모든 레이아웃/모바일/저장본 공통 */
#card[data-align="left"] .content,
#exportArea #card[data-align="left"] .content{
  text-align:left !important;
}
#card[data-align="center"] .content,
#exportArea #card[data-align="center"] .content{
  text-align:center !important;
}
#card[data-align="right"] .content,
#exportArea #card[data-align="right"] .content{
  text-align:right !important;
}
#card[data-align="justify"] .content,
#exportArea #card[data-align="justify"] .content{
  text-align:justify !important;
  text-align-last:auto !important;
}
#card[data-align="center"] .meta,
#exportArea #card[data-align="center"] .meta{
  justify-content:center !important;
}
#card[data-align="left"] .meta,
#card[data-align="justify"] .meta,
#exportArea #card[data-align="left"] .meta,
#exportArea #card[data-align="justify"] .meta{
  justify-content:flex-start !important;
}
#card[data-align="right"] .meta,
#exportArea #card[data-align="right"] .meta{
  justify-content:flex-end !important;
}
#card[data-align="center"] .when,
#exportArea #card[data-align="center"] .when{
  margin-left:auto !important;
  margin-right:auto !important;
}
#card[data-align="right"] .when,
#exportArea #card[data-align="right"] .when{
  margin-left:auto !important;
  margin-right:0 !important;
}
#card[data-align="left"] .when,
#card[data-align="justify"] .when,
#exportArea #card[data-align="left"] .when,
#exportArea #card[data-align="justify"] .when{
  margin-left:0 !important;
  margin-right:auto !important;
}
</style>

</head>
<body>
<div class="wrap">
<h1>Timeline Maker</h1>
<main class="grid">
<aside class="panel editor">
<div class="section">기본 정보</div>
<div class="row2">
<div class="field"><label>NPC 이름</label><input id="npc" value="NPC"></div>
<div class="field"><label>PC 이름</label><input id="pc" value="PC"></div>
</div>
<div class="field"><label>카드 제목</label><input id="title" value="Timeline Maker"></div>
<div class="row2">
<div class="field"><label>레이아웃</label><select id="layoutMode"><option value="branch">좌우 가지치기</option><option value="vertical">한쪽 세로형</option><option value="horizontal">가로형</option></select></div>
<div class="field"><label>테마</label><select id="theme"><option value="cute">아기자기</option><option value="sky">하늘 다이어리</option><option value="paper">파스텔</option><option value="cyber">사이버 HUD</option><option value="lavender">연보라</option><option value="mint">파스텔 연두</option><option value="bw">흑백</option></select></div>
</div>
<div class="field"><label>상단 라벨</label><input id="label" value="timeline record"></div>
<div class="section">글자 메뉴바</div>
<div class="textbar">
<div class="bar-field full"><label>글자 크기</label><div class="range-line"><input id="fontSize" type="range" min="12" max="32" value="16"><span id="fontSizeValue" class="range-value">16px</span></div></div>
<div class="bar-field"><label>글씨체</label><select id="fontFamily"><option value="Pretendard">Pretendard</option><option value="Paperlogy">Paperlogy</option><option value="Wanted Sans">Wanted Sans</option><option value="SUIT">SUIT</option><option value="IBM Plex Sans KR">IBM Plex Sans KR</option><option value="Noto Sans KR">Noto Sans KR</option></select></div>
        <div class="field">
          <label>글자 정렬</label>
          <select id="textAlign">
            <option value="default">기본</option>
            <option value="left">왼쪽</option>
            <option value="center">중앙</option>
            <option value="right">오른쪽</option>
            <option value="justify">양쪽</option>
          </select>
        </div>

<div class="bar-field"><label>줄 간격</label><div class="range-line"><input id="lineHeight" type="range" min="1.2" max="2.4" step="0.05" value="1.7"><span id="lineHeightValue" class="range-value">1.7</span></div></div>
<div class="bar-field"><label>제목색</label><input id="titleColor" type="color" value="#3d3540"></div>
<div class="bar-field"><label>본문색</label><input id="memoColor" type="color" value="#6d5b68"></div>
</div>
<div class="btns"><button id="add">사건 추가</button></div>
<div class="section">사건 편집</div>
<div id="editors"></div>
</aside>
<section class="panel preview">
<div class="preview-top"><button class="save" id="save">PNG 저장</button></div>
<div id="card" class="theme-cute layout-branch">
<div class="card-inner">
<div class="tag" id="pLabel"></div>
<h2 class="card-title" id="pTitle"></h2>
<p class="card-sub" id="pSub"></p>
<div class="timeline" id="timeline"></div>
</div>
</div>
</section>
</main>
</div>
<script>
let events=[{when:'',what:'',memo:'',tag:''}];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function drawEditors(){
  $('editors').innerHTML=events.map((e,i)=>`
  <div class="event-editor">
    <div class="event-head">
      <div class="head-left"><div class="num">${String(i+1).padStart(2,'0')}</div><span>사건 ${String(i+1).padStart(2,'0')}</span></div>
      <button class="tiny" onclick="delEvent(${i})">삭제</button>
    </div>
    <div class="field"><label>언제</label><input value="${esc(e.when)}" placeholder="예: 첫 만남 / 2024 / 과거" oninput="setEvent(${i},'when',this.value)"></div>
    <div class="field"><label>무슨 일</label><input value="${esc(e.what)}" placeholder="예: 처음 만난 날" oninput="setEvent(${i},'what',this.value)"></div>
    <div class="field"><label>내용</label><textarea placeholder="관계에 영향을 준 사건 내용을 적어주세요." oninput="setEvent(${i},'memo',this.value)">${esc(e.memo)}</textarea></div>
    <div class="field"><label>짧은 태그</label><input value="${esc(e.tag)}" placeholder="선택 입력" oninput="setEvent(${i},'tag',this.value)"></div>
  </div>`).join('');
}

function drawPreview(){
  const label=$('label').value.trim();
  const title=$('title').value.trim();
  const npc=$('npc').value.trim();
  const pc=$('pc').value.trim();
  const pair=[npc,pc].filter(Boolean).join(' × ');
  $('pLabel').textContent=label;$('pLabel').style.display=label?'inline-flex':'none';
  $('pTitle').textContent=title;$('pTitle').style.display=title?'block':'none';
  $('pSub').textContent=pair;$('pSub').style.display=pair?'block':'none';

  $('timeline').innerHTML='<div class="tline"></div>'+events.map((e,i)=>{
    const has=!!(e.when||e.what||e.memo||e.tag);
    const side=i%2===0?'left':'right';
    return `<article class="titem ${side} ${has?'has':'empty'}">
      <span class="arm"></span>
      <div class="dot">${String(i+1).padStart(2,'0')}</div>
      <div class="content">
        ${e.when?`<div class="when">${esc(e.when)}</div>`:`<div class="when when-placeholder">&nbsp;</div>`}
        ${e.what?`<h3 class="what">${esc(e.what)}</h3>`:''}
        ${e.memo?`<p class="memo">${esc(e.memo)}</p>`:''}
        ${e.tag?`<div class="meta"><span class="chip">${esc(e.tag)}</span></div>`:''}
      </div>
    </article>`;
  }).join('');
}

function setEvent(i,k,v){events[i][k]=v;drawPreview();applyTextStyle()}
function delEvent(i){if(events.length<=1)return alert('최소 1개는 남겨주세요.');events.splice(i,1);render()}
function render(){drawEditors();drawPreview();applyTextStyle()}
$('add').onclick=()=>{events.push({when:'',what:'',memo:'',tag:''});render()};

['pc','npc','title','label'].forEach(id=>{$(id).oninput=()=>{drawPreview();applyTextStyle()}});
$('theme').onchange=applyCardClass;
$('layoutMode').onchange=applyCardClass;

function applyCardClass(){
  $('card').className='theme-'+$('theme').value+' layout-'+$('layoutMode').value;
  applyTextStyle();
}

['fontSize','fontFamily','textAlign','lineHeight','titleColor','memoColor'].forEach(id=>{
  $(id).oninput=applyTextStyle;
  $(id).onchange=applyTextStyle;
});

function applyTextStyle(){
  const card=$('card');
  const font=$('fontFamily').value;
  card.dataset.align=$('textAlign') ? $('textAlign').value : 'default';
  $('fontSizeValue').textContent=$('fontSize').value+'px';
  $('lineHeightValue').textContent=$('lineHeight').value;
  card.style.fontSize=$('fontSize').value+'px';
  card.style.setProperty('--lineHeight',$('lineHeight').value);
  card.style.setProperty('--font',`"${font}", Pretendard, "Noto Sans KR", sans-serif`);
  card.style.setProperty('--cardText',$('titleColor').value);
  card.style.setProperty('--subText',$('memoColor').value);
}

$('save').onclick=async()=>{
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  applyTextStyle();
  const clone=$('card').cloneNode(true);
  clone.id='card';
  const exportArea=document.createElement('div');
  exportArea.id='exportArea';
  exportArea.appendChild(clone);
  document.body.appendChild(exportArea);
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  const targetWidth=clone.classList.contains('layout-horizontal')?1100:920;
  const canvas=await html2canvas(clone,{
    scale:2,
    backgroundColor:null,
    useCORS:true,
    logging:false,
    windowWidth:targetWidth+220,
    windowHeight:clone.scrollHeight+220,
    scrollX:0,
    scrollY:0
  });
  exportArea.remove();
  const a=document.createElement('a');
  a.download=(($('title').value||'timeline').replace(/[\\/:*?"<>|]/g,'').trim()||'timeline')+'.png';
  a.href=canvas.toDataURL('image/png');
  a.click();
};

render();
</script>

<style>
/* 모바일에서 저장한 가지치기 PNG에 보이는 배경 가로 점선 제거 */
#exportArea #card.layout-branch::before{
  display:none !important;
  content:none !important;
}
</style>

<style>
/* 가지치기형: '언제'를 비워도 '무슨 일' 위치가 위로 올라가지 않게 자리만 유지 */
#card.layout-branch .when-placeholder,
#exportArea #card.layout-branch .when-placeholder{
  visibility:hidden !important;
  pointer-events:none !important;
}
</style>
</body>


</html>
