<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timeline Maker</title>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700;800&family=Nanum+Gothic:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700;800;900&family=Gothic+A1:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans/dist/webfonts/static/complete/WantedSans.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-11@1.0/NanumSquareNeo-Variable.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_twelve@1.1/42dotSans.css">

  <style>
    :root{
      --ui-a:#ff9fc8;
      --ui-b:#c6b8ff;
      --ui-ink:#3d3540;
      --ui-sub:#8e7a89;
      --line:#efd9e6;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100vh;
      font-family:Pretendard, "Noto Sans KR", system-ui, sans-serif;
      color:var(--ui-ink);
      background:linear-gradient(135deg,#fff8fb,#fff1dc);
    }

    .wrap{
      width:min(1340px, calc(100% - 28px));
      margin:auto;
      padding:32px 0 56px;
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:18px;
      margin-bottom:22px;
    }

    h1{
      margin:0;
      font-size:clamp(30px,5vw,52px);
      letter-spacing:-.06em;
      line-height:.95;
    }

    .grid{
      display:grid;
      grid-template-columns:430px 1fr;
      gap:22px;
      align-items:start;
    }

    .panel{
      background:#fffafc;
      border:1px solid #f0dce8;
      border-radius:30px;
      box-shadow:0 18px 48px rgba(153,90,128,.13);
    }

    .editor{
      padding:22px;
      position:sticky;
      top:18px;
      max-height:calc(100vh - 36px);
      overflow:auto;
    }

    .editor::-webkit-scrollbar{ width:8px; }
    .editor::-webkit-scrollbar-thumb{ background:#ead2df; border-radius:99px; }

    .section{
      font-weight:950;
      color:#735669;
      font-size:14px;
      margin:4px 0 12px;
    }

    .field{ margin-bottom:12px; }

    label{
      display:block;
      font-size:12px;
      font-weight:950;
      color:#9a8292;
      margin:0 0 7px 2px;
    }

    input, textarea, select{
      width:100%;
      border:1px solid var(--line);
      background:#fff;
      border-radius:16px;
      padding:12px 13px;
      font:inherit;
      font-size:14px;
      color:var(--ui-ink);
      outline:none;
    }

    textarea{
      min-height:130px;
      resize:vertical;
      line-height:1.55;
    }

    input:focus, textarea:focus, select:focus{
      border-color:var(--ui-a);
      box-shadow:0 0 0 4px rgba(255,159,200,.18);
    }

    input[type="range"]{ accent-color:var(--ui-a); }

    input[type="color"]{
      height:42px;
      padding:4px;
      cursor:pointer;
    }

    .row2{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .btns{
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
      margin:14px 0 20px;
    }

    button{
      border:0;
      border-radius:16px;
      padding:12px 14px;
      font:inherit;
      font-weight:950;
      color:white;
      background:linear-gradient(135deg,var(--ui-a),var(--ui-b));
      box-shadow:0 12px 24px rgba(190,118,170,.24);
      cursor:pointer;
    }

    .textbar{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      padding:14px;
      border-radius:22px;
      background:#fff;
      border:1px solid #efd9e6;
      margin-bottom:16px;
    }

    .bar-field{ display:grid; gap:7px; }
    .bar-field.full{ grid-column:1/-1; }

    .range-line{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .range-line input{ padding:0; }

    .range-value{
      min-width:36px;
      text-align:right;
      font-weight:900;
      color:#9a8292;
      font-size:12px;
    }

    .event-editor{
      padding:4px 0 18px;
      margin-bottom:18px;
      border-bottom:1px dashed rgba(190,150,175,.45);
    }

    .event-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom:12px;
    }

    .num{
      width:34px;
      height:34px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:linear-gradient(135deg,#ffe4f0,#fff3d7);
      color:#c7669a;
      font-weight:950;
      font-size:13px;
    }

    .head-left{
      display:flex;
      align-items:center;
      gap:9px;
      font-weight:950;
    }

    .tiny{
      width:auto;
      padding:8px 10px;
      border-radius:999px;
      background:#fff;
      color:#b67b9c;
      border:1px solid #f0dce8;
      box-shadow:none;
      font-size:12px;
    }

    .preview{ padding:22px; }

    .preview-top{
      display:flex;
      justify-content:flex-end;
      gap:14px;
      align-items:center;
      margin-bottom:16px;
    }

    .save{
      min-width:138px;
      background:linear-gradient(135deg,#ff8eba,#ffbd90);
    }

    #card{
      --font:Pretendard, "Noto Sans KR", sans-serif;
      --a:#ff9fc8;
      --b:#ffc4a8;
      --c:#c6b8ff;
      --cardText:#3d3540;
      --subText:#927b8d;
      --box:#fff;
      --boxBorder:#f6d9e8;
      --tagBg:#fff1f7;
      --tagText:#b56c92;
      --chipBg:#fff8df;
      --chipText:#a1784e;
      --dash:#eecce0;

      width:min(100%,820px);
      margin:0 auto;
      border-radius:38px;
      padding:42px;
      position:relative;
      overflow:hidden;
      border:1px solid var(--boxBorder);
      box-shadow:0 24px 60px rgba(120,75,110,.13);
      background:linear-gradient(180deg,#fffefd,#fff7fb);
      color:var(--cardText);
      font-size:16px;
      font-family:var(--font) !important;
    }

    #card, #card *{ font-family:var(--font) !important; }

    #card:before{
      content:"";
      position:absolute;
      inset:16px;
      border:1px dashed var(--dash);
      border-radius:29px;
      pointer-events:none;
    }

    .card-inner{ position:relative; z-index:1; }

    .tag{
      display:inline-flex;
      padding:7px 11px;
      border-radius:999px;
      background:var(--tagBg);
      border:1px solid var(--boxBorder);
      font-size:.72em;
      font-weight:950;
      letter-spacing:.13em;
      text-transform:uppercase;
      color:var(--tagText);
    }

    .card-title{
      margin:14px 0 6px;
      font-size:2.25em;
      line-height:1.04;
      letter-spacing:-.06em;
      color:var(--cardText);
    }

    .card-sub{
      margin:0 0 36px;
      color:var(--subText);
      font-size:.9em;
      font-weight:750;
    }

    .tree{
      position:relative;
      display:grid;
      gap:0;
      padding:0 10px;
    }

    .tree:before{
      content:"";
      position:absolute;
      left:50%;
      top:8px;
      bottom:8px;
      width:3px;
      transform:translateX(-50%);
      border-radius:99px;
      background:linear-gradient(180deg,var(--a),var(--b),var(--c));
    }

    .event{
      display:grid;
      grid-template-columns:1fr 58px 1fr;
      gap:0;
      align-items:start;
      padding-bottom:30px;
    }

    .event:last-child{ padding-bottom:0; }

    .marker{
      grid-column:2;
      justify-self:center;
      position:relative;
      z-index:2;
      width:42px;
      height:42px;
      border-radius:50%;
      background:var(--box);
      border:3px solid var(--a);
      display:grid;
      place-items:center;
      color:var(--tagText);
      font-size:.78em;
      font-weight:950;
      box-shadow:0 8px 18px rgba(120,75,110,.12);
    }

    .event-card{
      position:relative;
      background:transparent;
      border:0;
      border-radius:0;
      padding:4px 0;
      box-shadow:none;
      color:var(--cardText);
    }

    .event-card:before{
      content:"";
      position:absolute;
      top:20px;
      width:32px;
      height:2px;
      background:linear-gradient(90deg,var(--a),transparent);
    }

    .event:nth-child(odd) .event-card{
      grid-column:1;
      text-align:right;
      padding-right:20px;
    }

    .event:nth-child(odd) .event-card:before{
      right:-28px;
      transform:scaleX(-1);
    }

    .event:nth-child(even) .event-card{
      grid-column:3;
      text-align:left;
      padding-left:20px;
    }

    .event:nth-child(even) .event-card:before{ left:-28px; }

    .when{
      display:inline-flex;
      max-width:100%;
      padding:6px 10px;
      border-radius:999px;
      background:var(--tagBg);
      border:1px solid var(--boxBorder);
      color:var(--tagText);
      font-size:.78em;
      font-weight:950;
      margin-bottom:9px;
    }

    .what{
      margin:0 0 8px;
      font-size:1.23em;
      letter-spacing:-.04em;
      line-height:1.2;
      color:var(--cardText);
    }

    .memo{
      margin:0;
      color:var(--subText);
      font-size:.92em;
      line-height:var(--lineHeight, 1.7);
      white-space:pre-wrap;
    }

    .meta{
      display:flex;
      flex-wrap:wrap;
      gap:7px;
      margin-top:12px;
    }

    .event:nth-child(odd) .meta{ justify-content:flex-end; }

    .chip{
      padding:6px 9px;
      border-radius:999px;
      background:var(--chipBg);
      color:var(--chipText);
      font-size:.72em;
      font-weight:900;
    }

    .footer{
      display:flex;
      justify-content:space-between;
      gap:10px;
      margin-top:34px;
      padding-top:16px;
      border-top:1px dashed var(--dash);
      font-size:.72em;
      font-weight:900;
      color:var(--subText);
      letter-spacing:.04em;
    }

    #card.theme-cute{
      --a:#ff9fc8; --b:#ffc4a8; --c:#c6b8ff;
      --cardText:#4a3441; --subText:#8c6f82;
      --box:#fff; --boxBorder:#f6d9e8;
      --tagBg:#fff1f7; --tagText:#c46f9a;
      --chipBg:#fff8df; --chipText:#a1784e;
      --dash:#eecce0;
      background:linear-gradient(180deg,#fffefd,#fff7fb);
    }

    #card.theme-sky{
      --a:#8fdcff; --b:#d9f4ff; --c:#b8ecff;
      --cardText:#2f5366; --subText:#63889a;
      --box:#fff; --boxBorder:#cceeff;
      --tagBg:#eaf8ff; --tagText:#4286aa;
      --chipBg:#f0fbff; --chipText:#5c91aa;
      --dash:#cceeff;
      background:linear-gradient(180deg,#fcffff,#edf9ff);
    }

    #card.theme-paper{
      --a:#f5bfd5; --b:#ffe8ca; --c:#d7d2ff;
      --cardText:#493d43; --subText:#8a7980;
      --box:#fff; --boxBorder:#f6d8e5;
      --tagBg:#fff1f7; --tagText:#bd7692;
      --chipBg:#fff6de; --chipText:#9b7651;
      --dash:#f0d5df;
      background:linear-gradient(180deg,#fffef9,#fff8fc);
    }

    #card.theme-cyber{
      --a:#7adfff; --b:#9dfff2; --c:#95b5ff;
      --cardText:#eef9ff; --subText:#bcd3e3;
      --box:#111d2e; --boxBorder:#28536a;
      --tagBg:#142a3a; --tagText:#bdecff;
      --chipBg:#152f33; --chipText:#d2fff7;
      --dash:#315e76;
      background:linear-gradient(180deg,#101a2a,#0e1725);
      border-color:#28536a;
      box-shadow:0 24px 60px rgba(0,0,0,.22);
    }

    #card.theme-mono{
      --a:#aaa; --b:#d8d8d8; --c:#888;
      --cardText:#303030; --subText:#777;
      --box:#fff; --boxBorder:#ddd;
      --tagBg:#f6f6f6; --tagText:#666;
      --chipBg:#f1f1f1; --chipText:#666;
      --dash:#d2d2d2;
      background:linear-gradient(180deg,#fff,#f8f8f8);
    }

    #card.theme-lavender{
      --a:#cbb7ff; --b:#efe6ff; --c:#dccfff;
      --cardText:#51446b; --subText:#82749a;
      --box:#fff; --boxBorder:#e6dcff;
      --tagBg:#f3ecff; --tagText:#8f77bd;
      --chipBg:#f7f1ff; --chipText:#826bb4;
      --dash:#ddd0ff;
      background:linear-gradient(180deg,#fbf8ff,#f2ecff);
    }

    #card.theme-mint{
      --a:#bfeec4; --b:#dff8d8; --c:#ecffe7;
      --cardText:#405c3f; --subText:#75906f;
      --box:#fff; --boxBorder:#d6f6d0;
      --tagBg:#efffea; --tagText:#6f9f71;
      --chipBg:#f5fff1; --chipText:#71945e;
      --dash:#d6f6d0;
      background:linear-gradient(180deg,#fbfff8,#f2ffef);
    }

    #card.theme-bw{
      --a:#777; --b:#cfcfcf; --c:#f0f0f0;
      --cardText:#111; --subText:#555;
      --box:#fff; --boxBorder:#ddd;
      --tagBg:#f4f4f4; --tagText:#333;
      --chipBg:#eee; --chipText:#444;
      --dash:#bbb;
      background:linear-gradient(180deg,#fff,#efefef);
    }

    #card.layout-vertical .tree{ padding-left:0; }
    .layout-vertical .tree:before{ left:21px; transform:none; }
    .layout-vertical .event{ grid-template-columns:46px 1fr; gap:14px; }
    .layout-vertical .marker{ grid-column:1; }
    .layout-vertical .event:nth-child(odd) .event-card,
    .layout-vertical .event:nth-child(even) .event-card{
      grid-column:2;
      text-align:left;
      padding-left:10px;
      padding-right:0;
    }
    .layout-vertical .event:nth-child(odd) .event-card:before,
    .layout-vertical .event:nth-child(even) .event-card:before{
      left:-20px;
      right:auto;
      transform:none;
      width:22px;
    }
    .layout-vertical .event:nth-child(odd) .meta{ justify-content:flex-start; }

    #card.layout-horizontal{ width:min(100%,1100px); }
    .layout-horizontal .tree{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:24px;
      padding:26px 0 4px;
    }
    .layout-horizontal .tree:before{ display:none; }
    .layout-horizontal .event{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
      padding:0;
      text-align:center;
    }
    .layout-horizontal .marker{ justify-self:center; }
    .layout-horizontal .event:nth-child(odd) .event-card,
    .layout-horizontal .event:nth-child(even) .event-card{
      width:100%;
      grid-column:auto;
      text-align:center;
      padding:0;
      margin:0;
    }
    .layout-horizontal .event:nth-child(odd) .event-card:before,
    .layout-horizontal .event:nth-child(even) .event-card:before{ display:none; }
    .layout-horizontal .meta{ justify-content:center; }
    .layout-horizontal .when{ justify-content:center; }
    .layout-horizontal .memo{ text-align:center; }

    @media(max-width:980px){
      .top{ flex-direction:column; align-items:flex-start; }
      .grid{ grid-template-columns:1fr; }
      .editor{ position:relative; top:auto; max-height:none; }
      #card{ padding:30px 20px; }
      .card-title{ font-size:1.9em; }
      .event{ grid-template-columns:42px 1fr; gap:14px; }
      .tree:before{ left:21px; transform:none; }
      .event:nth-child(odd) .event-card,
      .event:nth-child(even) .event-card{
        grid-column:2;
        margin:0;
        text-align:left;
        padding-left:10px;
        padding-right:0;
      }
      .event:nth-child(odd) .event-card:before,
      .event:nth-child(even) .event-card:before{ display:none; }
      .event:nth-child(odd) .marker,
      .event:nth-child(even) .marker{ grid-column:1; }
      .event:nth-child(odd) .meta{ justify-content:flex-start; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <h1>Timeline Maker</h1>
    </div>

    <main class="grid">
      <aside class="panel editor">
        <div class="section">기본 정보</div>

        <div class="row2">
          <div class="field">
            <label>NPC 이름</label>
            <input id="npc" value="NPC">
          </div>
          <div class="field">
            <label>PC 이름</label>
            <input id="pc" value="PC">
          </div>
        </div>

        <div class="field">
          <label>카드 제목</label>
          <input id="title" value="Timeline Maker">
        </div>

        <div class="row2">
          <div class="field">
            <label>레이아웃</label>
            <select id="layoutMode">
              <option value="branch">좌우 가지치기</option>
              <option value="vertical">한쪽 세로형</option>
              <option value="horizontal">가로형</option>
            </select>
          </div>
          <div class="field">
            <label>테마</label>
            <select id="theme">
              <option value="cute">아기자기</option>
              <option value="sky">하늘 다이어리</option>
              <option value="paper">파스텔</option>
              <option value="cyber">사이버 HUD</option>
              <option value="lavender">연보라</option>
              <option value="mint">파스텔 연두</option>
              <option value="bw">흑백</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label>상단 라벨</label>
          <input id="label" value="timeline record">
        </div>

        <div class="section">글자 메뉴바</div>
        <div class="textbar">
          <div class="bar-field full">
            <label>글자 크기</label>
            <div class="range-line">
              <input id="fontSize" type="range" min="12" max="32" value="16">
              <span id="fontSizeValue" class="range-value">16px</span>
            </div>
          </div>

          <div class="bar-field">
            <label>글씨체</label>
            <select id="fontFamily">
              <option value="Pretendard">Pretendard</option>
              <option value="Paperlogy">Paperlogy</option>
              <option value="Wanted Sans">Wanted Sans</option>
              <option value="NanumSquareNeo">NanumSquare Neo</option>
              <option value="42dot Sans">42dot Sans</option>
              <option value="Noto Sans KR">Noto Sans KR</option>
              <option value="IBM Plex Sans KR">IBM Plex Sans KR</option>
              <option value="Gothic A1">Gothic A1</option>
            </select>
          </div>

          <div class="bar-field">
            <label>줄 간격</label>
            <div class="range-line">
              <input id="lineHeight" type="range" min="1.2" max="2.4" step="0.05" value="1.7">
              <span id="lineHeightValue" class="range-value">1.7</span>
            </div>
          </div>

          <div class="bar-field">
            <label>제목색</label>
            <input id="titleColor" type="color" value="#3d3540">
          </div>

          <div class="bar-field">
            <label>본문색</label>
            <input id="memoColor" type="color" value="#6d5b68">
          </div>
        </div>

        <div class="btns">
          <button id="add">사건 추가</button>
        </div>

        <div class="section">사건 편집</div>
        <div id="editors"></div>
      </aside>

      <section class="panel preview">
        <div class="preview-top">
          <button class="save" id="save">PNG 저장</button>
        </div>

        <div id="card" class="theme-cute layout-branch">
          <div class="card-inner">
            <div class="tag" id="pLabel"></div>
            <h2 class="card-title" id="pTitle"></h2>
            <p class="card-sub" id="pSub"></p>
            <div class="tree" id="timeline"></div>
            <div class="footer">
              <span>RELATION TIMELINE</span>
              <span>PNG EXPORT</span>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

<script>
  let events = [
    {
      when:'n년 전 과거',
      what:'처음 엇갈린 시점',
      memo:'아직 서로의 이름도 제대로 모르던 시기. 작은 오해와 우연한 동선이 겹치며, 이후 관계의 첫 기준점이 된다.',
      tag:'origin'
    },
    {
      when:'어느 날',
      what:'관계가 흔들린 사건',
      memo:'평소라면 지나쳤을 행동 하나가 이상하게 오래 남는다. 이때부터 상대를 보는 기준이 조금씩 달라지기 시작한다.',
      tag:'turning point'
    },
    {
      when:'현재',
      what:'지금의 관계',
      memo:'과거의 사건들이 쌓여 현재의 거리감과 신뢰, 익숙함을 만든 상태. 아직 정리되지 않은 감정도 함께 남아 있다.',
      tag:'now'
    }
  ];

  const $ = id => document.getElementById(id);

  const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[m]));

  function drawEditors(){
    $('editors').innerHTML = events.map((e,i) => `
      <div class="event-editor">
        <div class="event-head">
          <div class="head-left">
            <div class="num">${String(i+1).padStart(2,'0')}</div>
            <span>${esc(e.when || '언제')}</span>
          </div>
          <button class="tiny" onclick="delEvent(${i})">삭제</button>
        </div>

        <div class="field">
          <label>언제</label>
          <input value="${esc(e.when)}" oninput="setEvent(${i}, 'when', this.value)">
        </div>

        <div class="field">
          <label>무슨 일</label>
          <input value="${esc(e.what)}" oninput="setEvent(${i}, 'what', this.value)">
        </div>

        <div class="field">
          <label>내용</label>
          <textarea oninput="setEvent(${i}, 'memo', this.value)">${esc(e.memo)}</textarea>
        </div>

        <div class="field">
          <label>짧은 태그</label>
          <input value="${esc(e.tag)}" oninput="setEvent(${i}, 'tag', this.value)">
        </div>
      </div>
    `).join('');
  }

  function drawPreview(){
    const label = $('label').value.trim();
    const title = $('title').value.trim();
    const npc = $('npc').value.trim();
    const pc = $('pc').value.trim();

    $('pLabel').textContent = label;
    $('pLabel').style.display = label ? 'inline-flex' : 'none';

    $('pTitle').textContent = title;
    $('pTitle').style.display = title ? 'block' : 'none';

    const pair = [npc, pc].filter(Boolean).join(' × ');
    $('pSub').textContent = pair;
    $('pSub').style.display = pair ? 'block' : 'none';

    $('timeline').innerHTML = events.map((e,i) => `
      <article class="event">
        <div class="marker">${String(i+1).padStart(2,'0')}</div>
        <div class="event-card">
          <div class="when">${esc(e.when || '언제')}</div>
          <h3 class="what">${esc(e.what || '무슨 일')}</h3>
          <p class="memo">${esc(e.memo || '내용 없음')}</p>
          ${e.tag ? `<div class="meta"><span class="chip">${esc(e.tag)}</span></div>` : ''}
        </div>
      </article>
    `).join('');
  }

  function setEvent(i,k,v){
    events[i][k] = v;
    drawPreview();
    if(k === 'when') drawEditors();
    applyTextStyle();
  }

  function delEvent(i){
    if(events.length <= 1) return alert('최소 1개는 남겨주세요.');
    events.splice(i,1);
    render();
  }

  function render(){
    drawEditors();
    drawPreview();
    applyTextStyle();
  }

  $('add').onclick = () => {
    events.push({
      when:'언제',
      what:'무슨 일',
      memo:'관계에 영향을 준 일을 적어주세요.',
      tag:'event'
    });
    render();
  };

  ['pc','npc','title','label'].forEach(id => {
    $(id).oninput = () => {
      drawPreview();
      applyTextStyle();
    };
  });

  $('theme').onchange = applyCardClass;
  $('layoutMode').onchange = applyCardClass;

  function applyCardClass(){
    $('card').className = 'theme-' + $('theme').value + ' layout-' + $('layoutMode').value;
    applyTextStyle();
  }

  ['fontSize','fontFamily','lineHeight','titleColor','memoColor'].forEach(id => {
    $(id).oninput = applyTextStyle;
    $(id).onchange = applyTextStyle;
  });

  function applyTextStyle(){
    const card = $('card');
    const font = $('fontFamily').value;
    const titleColor = $('titleColor').value;
    const memoColor = $('memoColor').value;

    $('fontSizeValue').textContent = $('fontSize').value + 'px';
    $('lineHeightValue').textContent = $('lineHeight').value;
    card.style.fontSize = $('fontSize').value + 'px';
    card.style.setProperty('--lineHeight', $('lineHeight').value);
    card.style.setProperty('--font', `"${font}", Pretendard, "Noto Sans KR", sans-serif`);

    card.style.setProperty('--cardText', titleColor);
    card.style.setProperty('--subText', memoColor);
  }

  $('save').onclick = async () => {
    if (document.fonts && document.fonts.ready) {
      await document.fonts.ready;
    }

    applyTextStyle();

    const canvas = await html2canvas($('card'), {
      scale: 2,
      backgroundColor: null,
      useCORS: true,
      logging: false
    });

    const a = document.createElement('a');
    a.download = (($('title').value || 'timeline').replace(/[\\/:*?"<>|]/g,'').trim() || 'timeline') + '.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  };

  render();
</script>
</body>
</html>
