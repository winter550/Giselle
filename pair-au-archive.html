<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pair AU Archive</title>

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css');
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@400;500;700;900&family=Nanum+Gothic:wght@400;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Gowun+Dodum&family=Gothic+A1:wght@400;500;700;800&family=Hahmlet:wght@400;500;700;800&display=swap');

    :root {
      --bg: #f8f9fa;
      --panel: #ffffff;
      --ink: #111111;
      --sub: #666666;
      --line: #e5e7eb;
      --point: #222222;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Pretendard", "Noto Sans KR", sans-serif;
      background: var(--bg);
      letter-spacing: -0.02em;
    }

    input, textarea, select, button {
      font: inherit;
    }

    .wrap {
      display: grid;
      grid-template-columns: 390px minmax(0, 1fr);
      gap: 24px;
      width: min(1400px, 100%);
      margin: 0 auto;
      padding: 32px 20px;
    }

    header {
      grid-column: 1 / -1;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      color: var(--point);
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.055em;
    }

    .panel {
      position: sticky;
      top: 32px;
      align-self: start;
      max-height: calc(100vh - 64px);
      overflow-y: auto;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.025);
    }

    .panel::-webkit-scrollbar {
      width: 6px;
    }

    .panel::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: #d9d9d9;
    }

    .section-title {
      margin: 0 0 20px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--line);
      color: var(--sub);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    label {
      display: block;
      margin: 16px 0 6px;
      color: #333333;
      font-size: 13px;
      font-weight: 700;
    }

    input, textarea, select {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: none;
      background: #ffffff;
      color: var(--ink);
      font-size: 14px;
    }

    textarea {
      min-height: 116px;
      resize: vertical;
      line-height: 1.65;
    }

    input:focus, textarea:focus, select:focus {
      border-color: #888888;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.035);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .layout-buttons,
    .align-buttons {
      display: grid;
      gap: 6px;
    }

    .layout-buttons {
      grid-template-columns: repeat(2, 1fr);
    }

    .align-buttons {
      grid-template-columns: repeat(4, 1fr);
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .color-grid label {
      margin-top: 0;
      font-size: 11px;
      color: var(--sub);
    }

    .color-grid input {
      height: 42px;
      padding: 4px;
      cursor: pointer;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 14px;
      color: #444444;
      background: #ffffff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    button:hover {
      background: #f3f4f6;
      border-color: #cccccc;
    }

    button.active,
    .primary {
      background: #222222 !important;
      color: #ffffff !important;
      border-color: #222222 !important;
    }

    .danger {
      background: #fff5f5;
      color: #e53e3e;
      border-color: #fed7d7;
    }

    .controls {
      display: grid;
      gap: 10px;
      margin-top: 24px;
    }

    .image-preview-area {
      display: none;
      margin-top: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fafafa;
    }

    .image-preview-area.show {
      display: block;
    }

    .range-control-row {
      display: grid;
      grid-template-columns: 74px 1fr 58px;
      align-items: center;
      gap: 8px;
      margin: 8px 0;
    }

    .range-control-row span {
      color: var(--sub);
      font-size: 11px;
      font-weight: 700;
    }

    .range-control-row input[type="range"] {
      padding: 0;
      cursor: pointer;
    }

    .range-control-row input[type="number"] {
      padding: 5px 4px;
      border-radius: 5px;
      text-align: center;
      font-size: 12px;
    }

    .img-mini-preview {
      display: block;
      width: 100%;
      max-height: 120px;
      object-fit: contain;
      border-radius: 6px;
      background: transparent;
    }

    .preview-shell {
      display: flex;
      flex-direction: column;
      padding: 32px;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.012);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
      color: var(--sub);
      font-size: 13px;
      font-weight: 700;
    }

    .live-wrap {
      display: none;
    }

    .live-label {
      display: none;
    }

    .pair-card.live-preview-card {
      border-style: dashed;
      border-color: #999999;
    }

    .pair-card.live-preview-card::before {
      content: "미리보기";
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 5;
      border-radius: 4px;
      padding: 2px 7px;
      background: rgba(17,17,17,.82);
      color: #ffffff;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
    }

    .archive-container-target {
      width: max-content;
      max-width: none;
      padding: 2px;
      overflow: visible;
    }

    .archive {
      display: grid;
      grid-template-columns: 640px;
      gap: 24px;
      width: max-content;
      max-width: none;
      align-items: start;
      justify-content: start;
    }

    .archive.horizontal {
      grid-template-columns: repeat(3, 300px);
      align-items: start;
      width: max-content;
      max-width: none;
    }

    .pair-card {
      --card-bg: #ffffff;
      --title-color: #111111;
      --body-color: #111111;
      --tag-color: #4b5563;
      --card-sub: #666666;
      --card-point: #222222;
      --tag-bg: #f3f4f6;
      --badge-bg: #f3f4f6;
      --card-font: "Pretendard", sans-serif;
      --card-font-size: 16px;
      --card-align: left;

      position: relative;
      width: 100%;
      overflow: hidden;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card-bg);
      color: var(--body-color);
      font-family: var(--card-font);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.012);
      user-select: text;
      transform: translateZ(0);
      align-self: start;
      min-height: 0;
      height: auto;
    }



    .pair-card.no-image {
      align-self: start !important;
      height: auto !important;
      min-height: 0 !important;
      padding: 22px !important;
    }

    .pair-card.no-image .image-container-frame {
      display: none !important;
      height: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
    }

    .pair-card.no-image .pair-head {
      margin-bottom: 10px;
    }

    .pair-card.no-image .tags {
      margin-top: 14px;
    }


    .card-export-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      border-radius: inherit;
      background: var(--card-bg);
      pointer-events: none;
    }

    .pair-card > *:not(.card-export-bg) {
      position: relative;
      z-index: 1;
    }

    .pair-card.dragging {
      opacity: .45;
    }

    .image-container-frame {
      width: 100%;
      height: 260px;
      overflow: hidden;
      margin-bottom: 20px;
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 10px;
      background: transparent;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .archive.horizontal .image-container-frame {
      height: 170px;
    }

    .pair-image-render {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
      background: transparent;
      pointer-events: none;
      transform-origin: center center;
    }

    .pair-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 16px;
    }

    .names {
      min-width: 0;
    }

    .pair-name {
      margin: 0;
      color: var(--title-color);
      font-size: 24px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.04em;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .type-badge {
      flex: 0 0 auto;
      padding: 5px 11px;
      border-radius: 4px;
      background: var(--badge-bg);
      color: var(--title-color);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .au-title {
      margin: 5px 0 0;
      color: var(--title-color);
      font-size: 14px;
      font-weight: 700;
      opacity: .78;
    }

    .desc {
      margin: 0;
      color: var(--body-color);
      white-space: pre-wrap;
      word-break: keep-all;
      overflow-wrap: anywhere;
      line-height: 1.75;
      font-size: var(--card-font-size);
      text-align: var(--card-align);
      text-align-last: auto;
    }

    .desc.justify {
      text-align: justify !important;
      text-align-last: left;
      text-justify: inter-character;
      word-break: normal;
      overflow-wrap: anywhere;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 20px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      border-radius: 4px;
      padding: 4px 8px;
      background: var(--tag-bg);
      color: var(--tag-color);
      font-size: 12px;
      font-weight: 700;
    }

    .card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 20px;
    }

    .card-actions button {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
    }

    .download-single {
      margin-top: 6px;
      width: 100%;
      padding: 9px;
      border-radius: 8px;
      background: #222;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
    }

    .capture-hide {
      display: none !important;
    }

    .capture-mode {
      box-shadow: none !important;
    }

    .capture-mode * {
      animation: none !important;
      transition: none !important;
    }


    .archive:not(.horizontal) .pair-card {
      width: 100%;
      max-width: 100%;
    }

    .archive.horizontal .pair-card {
      width: 100%;
    }


    .exporting .action-buttons-group,
    .exporting .live-preview-card {
      display: none !important;
    }


    body.exporting {
      background: #ffffff !important;
    }

    .exporting .archive,
    .exporting .archive-container-target {
      background: #ffffff !important;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 32px;
      z-index: 999;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      padding: 10px 20px;
      border-radius: 8px;
      background: #111111;
      color: white;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 900px) {
      .wrap {
        grid-template-columns: 1fr;
        padding: 20px 12px;
        gap: 20px;
      }

      .panel {
        position: static;
        max-height: none;
      }

      .archive.horizontal {
        grid-template-columns: repeat(3, 300px);
      }
    }
  
    @media (max-width: 620px) {
      .archive.horizontal {
        grid-template-columns: repeat(3, 300px);
      }
    }

  </style>

  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"></script>
</head>

<body>
  <main class="wrap">
    <header>
      <h1>Pair AU Archive</h1>
    </header>

    <aside class="panel">
      <p class="section-title">Edit Pair AU</p>

      <div class="grid-2">
        <div>
          <label for="nameA">이름 1</label>
          <input id="nameA" />
        </div>
        <div>
          <label for="nameB">이름 2</label>
          <input id="nameB" />
        </div>
      </div>

      <label for="pairType">구분</label>
      <select id="pairType">
        <option value="CP">CP</option>
        <option value="NCP">NCP</option>
      </select>

      <label for="auTitle">AU 이름 / 제목</label>
      <input id="auTitle" />

      <label for="auDesc">AU 설명</label>
      <textarea id="auDesc"></textarea>

      <label for="tags">태그</label>
      <input id="tags" placeholder="쉼표(,)로 구분" />

      <label for="imageInput">이미지 첨부</label>
      <input id="imageInput" type="file" accept="image/*" />

      <div id="imagePreviewArea" class="image-preview-area">
        <img id="imgMiniPreview" class="img-mini-preview" alt="첨부 이미지 미리보기" />

        <div class="range-control-row">
          <span>확대</span>
          <input id="imgScale" type="range" min="0.2" max="4" step="0.05" value="1" />
          <input id="imgScaleNum" type="number" min="0.2" max="4" step="0.05" value="1" />
        </div>

        <div class="range-control-row">
          <span>좌우</span>
          <input id="imgX" type="range" min="-300" max="300" step="1" value="0" />
          <input id="imgXNum" type="number" min="-300" max="300" step="1" value="0" />
        </div>

        <div class="range-control-row">
          <span>상하</span>
          <input id="imgY" type="range" min="-300" max="300" step="1" value="0" />
          <input id="imgYNum" type="number" min="-300" max="300" step="1" value="0" />
        </div>

        <div class="range-control-row">
          <span>회전</span>
          <input id="imgRotate" type="range" min="-180" max="180" step="1" value="0" />
          <input id="imgRotateNum" type="number" min="-180" max="180" step="1" value="0" />
        </div>

        <button id="resetImageBtn" type="button" style="margin-top: 8px; width: 100%;">이미지 위치 초기화</button>
        <button id="removeImageBtn" type="button" class="danger" style="margin-top: 8px; width: 100%;">이미지 삭제</button>
      </div>

      <label>틀 타입</label>
      <div class="layout-buttons" id="layoutButtons">
        <button type="button" data-layout="vertical" class="active">세로 피드형</button>
        <button type="button" data-layout="horizontal">가로 바둑판형</button>
      </div>

      <label>글씨 정렬</label>
      <div class="align-buttons" id="alignButtons">
        <button type="button" data-align="left" class="active">왼쪽</button>
        <button type="button" data-align="center">중앙</button>
        <button type="button" data-align="right">오른쪽</button>
        <button type="button" data-align="justify">양쪽</button>
      </div>

      <label for="fontSize">본문 글자 크기</label>
      <input id="fontSize" type="range" min="12" max="26" value="16" />

      <label>색상</label>
      <div class="color-grid">
        <div>
          <label for="titleColor">제목</label>
          <input id="titleColor" type="color" value="#111111" />
        </div>
        <div>
          <label for="bodyColor">본문</label>
          <input id="bodyColor" type="color" value="#111111" />
        </div>
        <div>
          <label for="tagColor">태그</label>
          <input id="tagColor" type="color" value="#4b5563" />
        </div>
      </div>

      <label for="fontFamily">글씨체</label>
      <select id="fontFamily">
        <option value="'Pretendard', sans-serif">Pretendard</option>
        <option value="'Noto Sans KR', sans-serif">Noto Sans KR</option>
        <option value="'Nanum Gothic', sans-serif">나눔고딕</option>
        <option value="'IBM Plex Sans KR', sans-serif">IBM Plex Sans KR</option>
        <option value="'Gowun Dodum', sans-serif">고운돋움</option>
        <option value="'Gothic A1', sans-serif">Gothic A1</option>
        <option value="'Noto Serif KR', serif">Noto Serif KR</option>
        <option value="'Hahmlet', serif">Hahmlet</option>
      </select>

      <label for="theme">카드 테마</label>
      <select id="theme">
        <option value="mono">Pure Minimal White 🤍</option>
        <option value="navy">Deep Navy 🌌</option>
        <option value="sky">Soft Aqua 🩵</option>
        <option value="rose">Dusty Rose 🩷</option>
        <option value="mint">Sage Garden 💚</option>
        <option value="lavender">Soft Lavender 💜</option>
        <option value="peach">Peach Cream 🍑</option>
        <option value="mocha">Warm Mocha ☕</option>
        <option value="slate">Blue Slate 🩶</option>
        <option value="wine">Deep Wine 🍷</option>
      </select>

      <div class="controls">
        <button type="button" class="primary" id="addBtn">아카이브 카드 추가</button>
        <button type="button" id="downloadAllBtn" style="background:#555; color:white; border-color:#555;">전체 PNG 저장</button>
        <button type="button" id="copyBtn">복사</button>
        <button type="button" class="danger" id="clearBtn">데이터 전체 삭제</button>
      </div>
    </aside>

    <section class="preview-shell">
      <div class="toolbar">
        <span id="countText">0 Cards</span>
        <span>Working Canvas Board</span>
      </div>

      <div id="liveWrap" class="live-wrap">
        <p class="live-label">Live Preview</p>
        <div id="livePreview"></div>
      </div>

      <div class="archive-container-target" id="archiveContainerTarget">
        <div class="archive" id="archive"></div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast">완료</div>

  <script>
    const $ = (id) => document.getElementById(id);
    const archive = $("archive");
    const countText = $("countText");
    const toast = $("toast");
    const imagePreviewArea = $("imagePreviewArea");
    const imgMiniPreview = $("imgMiniPreview");
    const liveWrap = $("liveWrap");
    const livePreview = $("livePreview");

    let currentImageData = "";
    let imgTransform = { scale: 1, x: 0, y: 0, rotate: 0 };
    let currentAlign = localStorage.getItem("pairAuAlign") || "left";
    let currentLayout = localStorage.getItem("pairAuLayout") || "vertical";
    let draggedCardId = null;
    const cachedFontReady = document.fonts ? document.fonts.ready : Promise.resolve();

    const themes = {
      mono: {
        cardBg: "#ffffff", point: "#222222", tagBg: "#f3f4f6", sub: "#666666", badgeBg: "#f3f4f6",
        title: "#111111", body: "#111111", tag: "#4b5563"
      },
      navy: {
        cardBg: "#101827", point: "#8eb7ff", tagBg: "#1c2b44", sub: "#aebbd0", badgeBg: "#233653",
        title: "#f5f8ff", body: "#dbe7ff", tag: "#b9d2ff"
      },
      sky: {
        cardBg: "#eef7fc", point: "#1e6292", tagBg: "#d5ecf8", sub: "#4e7b99", badgeBg: "#d2eafd",
        title: "#0d283d", body: "#0d283d", tag: "#16496e"
      },
      rose: {
        cardBg: "#fcf0f2", point: "#ba5d70", tagBg: "#f8dae0", sub: "#9a6670", badgeBg: "#f5cbd3",
        title: "#3b171e", body: "#3b171e", tag: "#702b37"
      },
      mint: {
        cardBg: "#edf4ee", point: "#3b7a57", tagBg: "#d4e6d7", sub: "#597563", badgeBg: "#cae2ce",
        title: "#12261a", body: "#12261a", tag: "#1e462f"
      },
      lavender: {
        cardBg: "#f4f0ff", point: "#7562bd", tagBg: "#e3dcff", sub: "#746a96", badgeBg: "#ded6fb",
        title: "#292044", body: "#332a4f", tag: "#5745a0"
      },
      peach: {
        cardBg: "#fff4ec", point: "#cc7651", tagBg: "#ffe0cf", sub: "#9a6b58", badgeBg: "#ffd9c5",
        title: "#3f241a", body: "#4a2c21", tag: "#9d4f32"
      },
      mocha: {
        cardBg: "#2a211c", point: "#d7b89b", tagBg: "#44342b", sub: "#c9b4a4", badgeBg: "#594236",
        title: "#fff1e6", body: "#ead6c7", tag: "#f1c9a8"
      },
      slate: {
        cardBg: "#eaf0f6", point: "#4f6d8a", tagBg: "#d5e0eb", sub: "#65798b", badgeBg: "#d0dce8",
        title: "#1b2a38", body: "#243747", tag: "#405d78"
      },
      wine: {
        cardBg: "#28131b", point: "#d98aa7", tagBg: "#4a2331", sub: "#c9a2b0", badgeBg: "#5b2a3b",
        title: "#fff0f5", body: "#f0d1dc", tag: "#ffc3d7"
      }
    };

    function safeLoadCards() {
      try {
        const saved = JSON.parse(localStorage.getItem("pairAuCards") || "[]");
        return Array.isArray(saved) ? saved : [];
      } catch {
        return [];
      }
    }

    let cards = safeLoadCards().map(card => normalizeCard(card));

    function normalizeCard(card) {
      const theme = themes[card.theme] || themes.mono;
      return {
        id: card.id || `card-${Date.now()}-${Math.random().toString(16).slice(2)}`,
        nameA: card.nameA || "",
        nameB: card.nameB || "",
        pairType: card.pairType === "NCP" ? "NCP" : "CP",
        auTitle: card.auTitle || "",
        auDesc: card.auDesc || "",
        tags: Array.isArray(card.tags) ? card.tags : [],
        imageData: card.imageData || "",
        imgTransform: card.imgTransform || { scale: 1, x: 0, y: 0, rotate: 0 },
        align: card.align || "left",
        fontSize: card.fontSize || "16",
        titleColor: card.titleColor || card.textColor || theme.title,
        bodyColor: card.bodyColor || card.textColor || theme.body,
        tagColor: card.tagColor || theme.tag,
        fontFamily: card.fontFamily || "'Pretendard', sans-serif",
        theme: card.theme || "mono"
      };
    }

    function save() {
      try {
        localStorage.setItem("pairAuCards", JSON.stringify(cards));
        localStorage.setItem("pairAuAlign", currentAlign);
        localStorage.setItem("pairAuLayout", currentLayout);
      } catch {
        showToast("브라우저 저장공간이 부족합니다. 이미지 용량을 줄여주세요.");
      }
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1400);
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function hasLiveContent(card) {
      return Boolean(
        card.nameA || card.nameB || card.auTitle || card.auDesc || card.tags.length || card.imageData
      );
    }

    function getFormData(isFinal = false) {
      return normalizeCard({
        id: isFinal ? `card-${Date.now()}-${Math.random().toString(16).slice(2)}` : "live-preview-id",
        nameA: $("nameA").value.trim(),
        nameB: $("nameB").value.trim(),
        pairType: $("pairType").value,
        auTitle: $("auTitle").value.trim(),
        auDesc: $("auDesc").value.trim(),
        tags: $("tags").value.split(",").map(t => t.trim()).filter(Boolean),
        imageData: currentImageData,
        imgTransform: { ...imgTransform },
        align: currentAlign,
        fontSize: $("fontSize").value,
        titleColor: $("titleColor").value,
        bodyColor: $("bodyColor").value,
        tagColor: $("tagColor").value,
        fontFamily: $("fontFamily").value,
        theme: $("theme").value
      });
    }


    function syncTransformUI() {
      const values = {
        imgScale: imgTransform.scale,
        imgScaleNum: imgTransform.scale,
        imgX: imgTransform.x,
        imgXNum: imgTransform.x,
        imgY: imgTransform.y,
        imgYNum: imgTransform.y,
        imgRotate: imgTransform.rotate,
        imgRotateNum: imgTransform.rotate
      };

      Object.entries(values).forEach(([id, value]) => {
        const el = $(id);
        if (el) el.value = value;
      });
    }

    function connectTransformPair(rangeId, numberId, field) {
      const range = $(rangeId);
      const number = $(numberId);
      if (!range || !number) return;

      const update = (value) => {
        let parsed = parseFloat(value);
        if (!Number.isFinite(parsed)) parsed = field === "scale" ? 1 : 0;

        if (field === "scale") parsed = Math.max(0.2, Math.min(4, parsed));
        if (field === "x" || field === "y") parsed = Math.max(-300, Math.min(300, parsed));
        if (field === "rotate") parsed = Math.max(-180, Math.min(180, parsed));

        imgTransform[field] = parsed;
        range.value = parsed;
        number.value = parsed;
        renderLivePreview();
      };

      range.addEventListener("input", (e) => update(e.target.value));
      range.addEventListener("change", (e) => update(e.target.value));
      number.addEventListener("input", (e) => update(e.target.value));
      number.addEventListener("change", (e) => update(e.target.value));
    }

    connectTransformPair("imgScale", "imgScaleNum", "scale");
    connectTransformPair("imgX", "imgXNum", "x");
    connectTransformPair("imgY", "imgYNum", "y");
    connectTransformPair("imgRotate", "imgRotateNum", "rotate");

    if ($("resetImageBtn")) {
      $("resetImageBtn").addEventListener("click", () => {
        imgTransform = { scale: 1, x: 0, y: 0, rotate: 0 };
        syncTransformUI();
        renderLivePreview();
        showToast("이미지 위치가 초기화되었습니다.");
      });
    }

    function updateImagePreview() {
      if (currentImageData) {
        imgMiniPreview.src = currentImageData;
        imagePreviewArea.classList.add("show");
      } else {
        imgMiniPreview.removeAttribute("src");
        imagePreviewArea.classList.remove("show");
      }
      syncTransformUI();
      renderLivePreview();
    }

    function buildCardElement(card, options = {}) {
      const isLive = options.isLive || false;
      const themeData = themes[card.theme] || themes.mono;
      const pairName = [card.nameA, card.nameB].filter(Boolean).join(" × ");
      const displayName = pairName || (isLive ? "이름 × 이름" : "");
      const tagsHtml = (card.tags || []).map(t => `<span class="tag">#${escapeHtml(t)}</span>`).join("");
      const alignClass = card.align === "justify" ? "justify" : "";
      const tf = card.imgTransform || { scale: 1, x: 0, y: 0, rotate: 0 };
      const imgStyle = `transform: translate(${tf.x}px, ${tf.y}px) scale(${tf.scale}) rotate(${tf.rotate}deg);`;

      const el = document.createElement("article");
      el.className = "pair-card" + (card.imageData ? " has-image" : " no-image") + (isLive ? " live-preview-card" : "");
      el.dataset.cardId = card.id;
      if (!isLive) el.draggable = true;

      el.style.setProperty("--card-align", card.align || "left");
      el.style.setProperty("--card-font-size", `${card.fontSize || 16}px`);
      el.style.setProperty("--card-bg", themeData.cardBg);
      el.style.backgroundColor = themeData.cardBg;
      el.style.setProperty("--card-point", themeData.point);
      el.style.setProperty("--tag-bg", themeData.tagBg);
      el.style.setProperty("--card-sub", themeData.sub);
      el.style.setProperty("--badge-bg", themeData.badgeBg);
      el.style.setProperty("--title-color", card.titleColor || themeData.title);
      el.style.setProperty("--body-color", card.bodyColor || themeData.body);
      el.style.setProperty("--tag-color", card.tagColor || themeData.tag);
      el.style.setProperty("--card-font", card.fontFamily || "'Pretendard', sans-serif");

      el.innerHTML = `
        <div class="card-export-bg" aria-hidden="true"></div>
        ${card.imageData ? `
          <div class="image-container-frame">
            <img class="pair-image-render" style="${imgStyle}" src="${card.imageData}" alt="첨부 이미지" />
          </div>
        ` : ""}
        <div class="pair-head">
          <div class="names">
            ${displayName ? `<h2 class="pair-name">${escapeHtml(displayName)}</h2>` : ""}
            ${card.auTitle ? `<p class="au-title">${escapeHtml(card.auTitle)}</p>` : ""}
          </div>
          <span class="type-badge">${escapeHtml(card.pairType || "CP")}</span>
        </div>
        ${card.auDesc ? `<p class="desc ${alignClass}" style="--card-align:${card.align || "left"};">${escapeHtml(card.auDesc)}</p>` : ""}
        ${tagsHtml ? `<div class="tags">${tagsHtml}</div>` : ""}
        ${!isLive ? `
          <div class="card-actions action-buttons-group">
            <button type="button" data-edit="${card.id}">수정</button>
            <button type="button" class="danger" data-delete="${card.id}">삭제</button>
          </div>
          <button type="button" class="download-single action-buttons-group" data-download-single="${card.id}">이 카드만 저장</button>
        ` : ""}
      `;

      return el;
    }

    function getLivePreviewElement() {
      const liveData = getFormData(false);
      if (!hasLiveContent(liveData)) return null;
      return buildCardElement(liveData, { isLive: true });
    }

    function renderLivePreview() {
      renderCards();
    }

    function renderCards() {
      archive.innerHTML = "";
      archive.className = "archive " + currentLayout;
      countText.textContent = `${cards.length} Cards`;

      document.querySelectorAll("#alignButtons button").forEach(b => {
        b.classList.toggle("active", b.dataset.align === currentAlign);
      });

      document.querySelectorAll("#layoutButtons button").forEach(b => {
        b.classList.toggle("active", b.dataset.layout === currentLayout);
      });

      const liveData = getFormData(false);
      if (hasLiveContent(liveData)) {
        archive.appendChild(buildCardElement(liveData, { isLive: true }));
      }

      cards.forEach(card => {
        archive.appendChild(buildCardElement(card, { isLive: false }));
      });
    }

    function renderAll() {
      renderCards();
    }

    function clearForm() {
      ["nameA", "nameB", "auTitle", "auDesc", "tags"].forEach(id => $(id).value = "");
      $("pairType").value = "CP";
      $("imageInput").value = "";
      currentImageData = "";
      imgTransform = { scale: 1, x: 0, y: 0, rotate: 0 };
      updateImagePreview();
    }


    async function waitForImages(root) {
      const images = Array.from(root.querySelectorAll("img"));
      await Promise.all(images.map(img => {
        if (img.complete && img.naturalWidth > 0) return Promise.resolve();
        return new Promise(resolve => {
          img.onload = resolve;
          img.onerror = resolve;
        });
      }));

      if ("decode" in HTMLImageElement.prototype) {
        await Promise.all(images.map(img => img.decode().catch(() => {})));
      }
    }

    async function waitForImages(root) {
      const images = Array.from(root.querySelectorAll("img"));
      await Promise.all(images.map(img => {
        if (img.complete && img.naturalWidth > 0) return Promise.resolve();
        return new Promise(resolve => {
          img.onload = resolve;
          img.onerror = resolve;
        });
      }));
      if ("decode" in HTMLImageElement.prototype) {
        await Promise.all(images.map(img => img.decode().catch(() => {})));
      }
    }

    function getExportBackgroundColor(targetNode) {
      if (targetNode.classList && targetNode.classList.contains("pair-card")) {
        return getComputedStyle(targetNode).backgroundColor || "#ffffff";
      }
      return "#ffffff";
    }

    async function downloadBlob(blob, fileName) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.download = `${fileName}-${Date.now()}.png`;
      link.href = url;
      document.body.appendChild(link);
      link.click();

      setTimeout(() => {
        URL.revokeObjectURL(url);
        link.remove();
      }, 1200);
    }


    function hardenCardBackgrounds(root) {
      const cardNodes = root.classList && root.classList.contains("pair-card")
        ? [root]
        : Array.from(root.querySelectorAll(".pair-card"));

      cardNodes.forEach(card => {
        const bg = getComputedStyle(card).getPropertyValue("--card-bg").trim()
          || getComputedStyle(card).backgroundColor
          || "#ffffff";

        card.style.backgroundColor = bg;

        let layer = card.querySelector(":scope > .card-export-bg");
        if (!layer) {
          layer = document.createElement("div");
          layer.className = "card-export-bg";
          layer.setAttribute("aria-hidden", "true");
          card.prepend(layer);
        }
        layer.style.background = bg;
      });
    }

    async function exportNodeToPng(targetNode, fileName, mode = "download") {
      if (!targetNode || typeof htmlToImage === "undefined") {
        showToast("PNG 저장 라이브러리를 불러오지 못했습니다.");
        return;
      }

      const savedCards = archive.querySelectorAll(".pair-card:not(.live-preview-card)");
      if (!savedCards.length && targetNode === archive) {
        showToast("저장할 카드가 없습니다.");
        return;
      }

      showToast(mode === "copy" ? "이미지 복사 중..." : "PNG 저장 중...");

      document.body.classList.add("exporting");

      const previousGridTemplateColumns = targetNode.style.gridTemplateColumns;
      const previousWidth = targetNode.style.width;

      if (targetNode === archive && currentLayout === "horizontal") {
        const visibleCards = Array.from(archive.querySelectorAll(".pair-card:not(.live-preview-card)"));
        const colCount = Math.min(3, Math.max(1, visibleCards.length));
        targetNode.style.gridTemplateColumns = `repeat(${colCount}, 300px)`;
        targetNode.style.width = "max-content";
      }

      await cachedFontReady;
      await waitForImages(targetNode);
      await new Promise(resolve => requestAnimationFrame(resolve));

      const exportBackgroundColor = "#ffffff";
      const computed = getComputedStyle(targetNode);
      const previousBg = targetNode.style.backgroundColor;

      hardenCardBackgrounds(targetNode);

      if (targetNode.classList && targetNode.classList.contains("pair-card")) {
        targetNode.style.backgroundColor = computed.getPropertyValue("--card-bg").trim() || computed.backgroundColor || exportBackgroundColor;
      }

      try {
        const blob = await htmlToImage.toBlob(targetNode, {
          pixelRatio: 1.5,
          cacheBust: false,
          backgroundColor: "#ffffff",
          skipAutoScale: true,
          style: {
            transform: "none",
            transformOrigin: "top left"
          },
          filter: (node) => {
            if (!node.classList) return true;
            if (node.classList.contains("live-preview-card")) return false;
            if (node.classList.contains("action-buttons-group")) return false;
            return true;
          }
        });

        if (!blob) {
          showToast(mode === "copy" ? "이미지 복사에 실패했습니다." : "PNG 저장에 실패했습니다.");
          return;
        }

        if (mode === "copy") {
          if (!navigator.clipboard || typeof ClipboardItem === "undefined") {
            showToast("이 브라우저는 이미지 클립보드 복사를 지원하지 않습니다.");
            return;
          }

          await navigator.clipboard.write([
            new ClipboardItem({ "image/png": blob })
          ]);
          showToast("이미지 복사가 완료되었습니다.");
        } else {
          await downloadBlob(blob, fileName);
          showToast("PNG 저장이 완료되었습니다.");
        }
      } catch (err) {
        console.error(err);
        showToast(mode === "copy" ? "이미지 복사에 실패했습니다." : "PNG 저장에 실패했습니다.");
      } finally {
        targetNode.style.backgroundColor = previousBg;
        targetNode.style.gridTemplateColumns = previousGridTemplateColumns;
        targetNode.style.width = previousWidth;
        document.body.classList.remove("exporting");
      }
    }

    async function captureTargetNode(targetNode, fileName) {
      await exportNodeToPng(targetNode, fileName, "download");
    }

    $("imageInput").addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      if (!file.type.startsWith("image/")) {
        showToast("이미지 파일만 첨부할 수 있습니다.");
        return;
      }

      const reader = new FileReader();
      reader.onload = () => {
        currentImageData = reader.result;
        imgTransform = { scale: 1, x: 0, y: 0, rotate: 0 };
        updateImagePreview();
        renderLivePreview();
        showToast("이미지가 로드되었습니다.");
      };
      reader.readAsDataURL(file);
    });

    $("removeImageBtn").addEventListener("click", () => {
      currentImageData = "";
      imgTransform = { scale: 1, x: 0, y: 0, rotate: 0 };
      $("imageInput").value = "";
      updateImagePreview();
      showToast("이미지가 삭제되었습니다.");
    });

    $("addBtn").addEventListener("click", () => {
      const data = getFormData(true);
      if (!hasLiveContent(data)) {
        showToast("내용을 입력해주세요.");
        return;
      }
      cards.unshift(data);
      save();
      clearForm();
      renderAll();
      showToast("카드가 추가되었습니다.");
    });

    $("downloadAllBtn").addEventListener("click", () => {
      if (!cards.length) {
        showToast("저장할 카드가 없습니다.");
        return;
      }
      captureTargetNode(archive, "pair-au-archive");
    });

    $("clearBtn").addEventListener("click", () => {
      if (confirm("모든 데이터를 초기화할까요?")) {
        cards = [];
        save();
        renderAll();
        showToast("전체 초기화가 완료되었습니다.");
      }
    });

    async function copyBoardImageToClipboard() {
      await exportNodeToPng(archive, "pair-au-archive", "copy");
    }

    $("copyBtn").addEventListener("click", copyBoardImageToClipboard);

    archive.addEventListener("click", (e) => {
      const singleId = e.target.dataset.downloadSingle;
      const editId = e.target.dataset.edit;
      const deleteId = e.target.dataset.delete;

      if (singleId) {
        const cardNode = e.target.closest(".pair-card");
        captureTargetNode(cardNode, "pair-au-card");
        return;
      }

      if (editId) {
        const card = cards.find(c => c.id === editId);
        if (!card) return;

        $("nameA").value = card.nameA || "";
        $("nameB").value = card.nameB || "";
        $("pairType").value = card.pairType || "CP";
        $("auTitle").value = card.auTitle || "";
        $("auDesc").value = card.auDesc || "";
        $("tags").value = (card.tags || []).join(", ");
        $("fontSize").value = card.fontSize || "16";
        $("titleColor").value = card.titleColor || "#111111";
        $("bodyColor").value = card.bodyColor || "#111111";
        $("tagColor").value = card.tagColor || "#4b5563";
        $("fontFamily").value = card.fontFamily || "'Pretendard', sans-serif";
        $("theme").value = card.theme || "mono";
        currentImageData = card.imageData || "";
        imgTransform = card.imgTransform || { scale: 1, x: 0, y: 0, rotate: 0 };
        currentAlign = card.align || "left";

        cards = cards.filter(c => c.id !== editId);
        save();
        updateImagePreview();
        renderAll();
        window.scrollTo({ top: 0, behavior: "smooth" });
        showToast("수정 모드로 불러왔습니다.");
        return;
      }

      if (deleteId) {
        if (confirm("이 카드를 삭제할까요?")) {
          cards = cards.filter(c => c.id !== deleteId);
          save();
          renderAll();
          showToast("삭제되었습니다.");
        }
      }
    });

    archive.addEventListener("dragstart", (e) => {
      const card = e.target.closest(".pair-card");
      if (!card || card.classList.contains("live-preview-card")) return;
      draggedCardId = card.dataset.cardId;
      card.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", draggedCardId);
    });

    archive.addEventListener("dragend", (e) => {
      const card = e.target.closest(".pair-card");
      if (card) card.classList.remove("dragging");
      draggedCardId = null;
    });

    archive.addEventListener("dragover", (e) => {
      e.preventDefault();
      const targetCard = e.target.closest(".pair-card");
      if (!targetCard || targetCard.classList.contains("live-preview-card") || !draggedCardId || targetCard.dataset.cardId === draggedCardId) return;

      const fromIndex = cards.findIndex(c => c.id === draggedCardId);
      const toIndex = cards.findIndex(c => c.id === targetCard.dataset.cardId);
      if (fromIndex < 0 || toIndex < 0 || fromIndex === toIndex) return;

      const [moved] = cards.splice(fromIndex, 1);
      cards.splice(toIndex, 0, moved);
      save();
      renderCards();
    });

    $("alignButtons").addEventListener("click", (e) => {
      if (!e.target.dataset.align) return;
      currentAlign = e.target.dataset.align;
      save();
      renderLivePreview();
      document.querySelectorAll("#alignButtons button").forEach(b => {
        b.classList.toggle("active", b.dataset.align === currentAlign);
      });
    });

    $("layoutButtons").addEventListener("click", (e) => {
      if (!e.target.dataset.layout) return;
      currentLayout = e.target.dataset.layout;
      save();
      renderCards();
      document.querySelectorAll("#layoutButtons button").forEach(b => {
        b.classList.toggle("active", b.dataset.layout === currentLayout);
      });
    });

    $("theme").addEventListener("change", () => {
      const targetTheme = themes[$("theme").value] || themes.mono;
      $("titleColor").value = targetTheme.title;
      $("bodyColor").value = targetTheme.body;
      $("tagColor").value = targetTheme.tag;
      renderLivePreview();
    });

    ["nameA", "nameB", "pairType", "auTitle", "auDesc", "tags", "fontSize", "titleColor", "bodyColor", "tagColor", "fontFamily", "theme"].forEach(id => {
      const el = $(id);
      if (!el) return;
      el.addEventListener("input", renderLivePreview);
      el.addEventListener("change", renderLivePreview);
    });


    function bindLivePreviewInputs() {
      const ids = [
        "nameA", "nameB", "pairType", "auTitle", "auDesc", "tags",
        "fontSize", "titleColor", "bodyColor", "tagColor", "fontFamily", "theme",
        
      ];

      ids.forEach(id => {
        const el = $(id);
        if (!el || el.dataset.liveBound === "true") return;
        el.dataset.liveBound = "true";
        el.addEventListener("input", renderLivePreview);
        el.addEventListener("change", renderLivePreview);
      });
    }

    bindLivePreviewInputs();

    save();
    renderAll();
  </script>
</body>
</html>
