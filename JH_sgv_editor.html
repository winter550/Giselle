<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SGV Profile Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600;700&family=Gothic+A1:wght@300;400;500;700&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@300;400;500&family=Exo+2:wght@300;400;600;700&family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Share+Tech+Mono&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--mono:'Share Tech Mono',monospace;--sf:'Orbitron',sans-serif}
[data-theme="dark"]{--bg:#040810;--side:#060c16;--side2:#07101a;--paper:#060b14;--box:#08101a;--line:rgba(80,120,200,.18);--line2:rgba(60,100,160,.13);--text:#c8d8e8;--sub:#4e6e88;--dim:#263a4e;--input:#040810}
[data-theme="light"]{--bg:#edf2f8;--side:#fff;--side2:#f4f7fd;--paper:#fff;--box:#f5f8ff;--line:rgba(40,80,160,.15);--line2:rgba(30,60,120,.11);--text:#0c1c2c;--sub:#486075;--dim:#90a8bc;--input:#eef3f9}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(50,120,190,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(50,120,190,.028) 1px,transparent 1px);background-size:42px 42px}
.app{position:relative;z-index:1;display:grid;grid-template-columns:300px 1fr;min-height:100vh}
/* SIDEBAR */
.sb{position:sticky;top:0;height:100vh;overflow:hidden;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column}
.sb-head{padding:11px 13px 9px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.brand{font-family:var(--sf);font-size:10px;letter-spacing:.14em;color:#8b7cff}
.brand small{display:block;font-family:var(--mono);font-size:7px;color:var(--sub);letter-spacing:.18em;margin-top:1px}
.ibtn{border:1px solid var(--line);background:transparent;color:var(--sub);font-family:var(--mono);font-size:8px;padding:4px 8px;cursor:pointer;letter-spacing:.1em;transition:all .13s}
.ibtn:hover{border-color:var(--text);color:var(--text)}
.moderow{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);flex-shrink:0}
.mbtn{border:0;border-right:1px solid var(--line);background:transparent;color:var(--sub);padding:9px 4px;font-family:var(--mono);font-size:9px;letter-spacing:.14em;cursor:pointer;transition:all .13s}
.mbtn:last-child{border-right:0}
.mbtn.on{color:var(--ac,#8b7cff);background:rgba(139,124,255,.07)}
.chartabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);min-height:33px;flex-shrink:0}
.chartabs::-webkit-scrollbar{height:2px}.chartabs::-webkit-scrollbar-thumb{background:var(--line)}
.ctab{border:0;border-right:1px solid var(--line);background:transparent;color:var(--sub);padding:7px 10px;font-family:var(--mono);font-size:9px;white-space:nowrap;cursor:pointer;transition:all .13s}
.ctab.on{color:var(--ac,#8b7cff);background:rgba(139,124,255,.07)}
.ctab .x{margin-left:5px;opacity:.35}
.addtab{border:0;background:transparent;color:var(--sub);font-size:16px;padding:2px 10px;cursor:pointer;transition:color .13s}
.addtab:hover{color:#8b7cff}
.stbar{display:none;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid var(--line);background:var(--side2);flex-shrink:0}
.stbtn{border:0;border-right:1px solid var(--line);background:transparent;color:var(--sub);padding:8px 4px;font-family:var(--mono);font-size:9px;letter-spacing:.13em;cursor:pointer;transition:all .13s}
.stbtn:last-child{border-right:0}
.stbtn.on{color:var(--ac,#8b7cff);background:rgba(139,124,255,.07)}
.scroll{flex:1;overflow-y:auto}.scroll::-webkit-scrollbar{width:2px}.scroll::-webkit-scrollbar-thumb{background:var(--line)}
.sec{padding:10px 13px;border-bottom:1px solid var(--line)}
.sec-hd{font-family:var(--mono);font-size:8px;letter-spacing:.22em;color:var(--sub);font-weight:400;margin-bottom:8px;text-transform:uppercase;display:flex;align-items:center;gap:5px}
.sec-hd::after{content:'';flex:1;height:1px;background:var(--line)}
.f{margin-bottom:7px}.f:last-child{margin-bottom:0}
.f label{display:block;font-family:var(--mono);font-size:8px;color:var(--sub);letter-spacing:.11em;margin-bottom:3px}
.f input,.f textarea,.f select{width:100%;border:1px solid var(--line);background:var(--input);color:var(--text);padding:6px 8px;font-family:'Noto Sans KR',sans-serif;font-size:12px;outline:none;transition:border-color .13s}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--ac,#8b7cff)}
.f textarea{min-height:60px;resize:vertical;line-height:1.6}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cline{display:flex;align-items:center;gap:7px}
.cline input[type=color]{width:32px;height:28px;padding:2px;border:1px solid var(--line);background:none;cursor:pointer;flex-shrink:0}
.cline input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
.cline input[type=color]::-webkit-color-swatch{border:none}
.cline span{font-family:var(--mono);font-size:9px;color:var(--sub);flex:1}
/* IMAGE BOX — 원본 비율 유지 */
.imgbox{border:1px dashed var(--line);background:#0a0f1a;cursor:pointer;position:relative;transition:border-color .13s;min-height:60px}
.imgbox:hover{border-color:var(--ac,#8b7cff)}
.imgbox-ph{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--dim);padding:24px;text-align:center;display:block}
.imgbox img{display:block;width:100%;height:auto}
.ictrl{display:flex;align-items:center;gap:5px;margin-top:4px}
.ictrl label{font-family:var(--mono);font-size:8px;color:var(--sub);width:36px;flex-shrink:0;letter-spacing:.08em}
.ictrl input[type=range]{flex:1;accent-color:var(--ac,#8b7cff);cursor:pointer}
.ictrl span{font-family:var(--mono);font-size:8px;color:var(--dim);width:36px;text-align:right;flex-shrink:0}
.entry{border:1px solid var(--line);padding:8px;margin-bottom:6px;background:var(--box);position:relative}
.entry::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--ac,#8b7cff);opacity:.4}
.etop{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.etop b{font-family:var(--mono);font-size:8px;letter-spacing:.1em;color:var(--ac,#8b7cff)}
.rmbtn{border:0;background:transparent;color:var(--dim);cursor:pointer;font-size:13px;line-height:1}.rmbtn:hover{color:#ff3355}
.addbtn{width:100%;border:1px dashed var(--line);background:transparent;color:var(--sub);padding:7px;font-family:var(--mono);font-size:8px;letter-spacing:.12em;cursor:pointer;transition:all .13s;text-transform:uppercase;margin-top:6px}
.addbtn:hover{border-color:var(--ac,#8b7cff);color:var(--ac,#8b7cff)}
.btm{padding:9px 13px;border-top:1px solid var(--line);background:var(--side2);flex-shrink:0;display:flex;flex-direction:column;gap:5px}
.bt{font-family:var(--mono);font-size:7px;color:var(--sub);letter-spacing:.16em;text-transform:uppercase;margin-bottom:2px}
.layrow{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line)}
.alrow{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line)}
.lbtn,.abtn{border:0;border-right:1px solid var(--line);background:transparent;color:var(--sub);padding:7px 3px;font-family:var(--mono);font-size:8px;cursor:pointer;transition:all .13s}
.lbtn:last-child,.abtn:last-child{border-right:0}
.lbtn.on,.abtn.on{color:var(--ac,#8b7cff);background:rgba(139,124,255,.07)}
.fsel{width:100%;border:1px solid var(--line);background:var(--input);color:var(--text);padding:6px 8px;font-family:'Noto Sans KR',sans-serif;font-size:12px;outline:none}
.acrow{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.acbtn{border:1px solid var(--line);background:transparent;color:var(--sub);padding:8px 4px;font-family:var(--mono);font-size:8px;letter-spacing:.09em;cursor:pointer;transition:all .13s}
.acbtn:hover{border-color:var(--ac,#8b7cff);color:var(--ac,#8b7cff)}
/* PREVIEW */
.preview{padding:28px;overflow:auto;display:flex;align-items:flex-start;justify-content:center;background:var(--bg)}
/* CARD SHARED */
.doc{position:relative;background:var(--paper);overflow:hidden}
.ck{position:absolute;width:13px;height:13px;z-index:20;pointer-events:none}
.ck.tl{top:0;left:0;border-top:2px solid;border-left:2px solid}
.ck.tr{top:0;right:0;border-top:2px solid;border-right:2px solid}
.ck.bl{bottom:0;left:0;border-bottom:2px solid;border-left:2px solid}
.ck.br{bottom:0;right:0;border-bottom:2px solid;border-right:2px solid}
.hexbg{position:absolute;top:6px;right:8px;font-family:var(--mono);font-size:6px;line-height:1.4;opacity:.04;pointer-events:none;white-space:pre;z-index:1;letter-spacing:.04em}
.topbar{height:2px;position:relative;z-index:5;flex-shrink:0}
.dbar{height:40px;border-bottom:1px solid var(--line2);display:grid;grid-template-columns:1fr auto 1fr;background:rgba(0,0,0,.12);flex-shrink:0;position:relative;z-index:3}
[data-theme="light"] .dbar{background:rgba(20,55,120,.04)}
.dbar-l,.dbar-r{display:flex;align-items:center;gap:6px;padding:0 12px;font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;overflow:hidden;white-space:nowrap}
.dbar-c{display:flex;align-items:center;justify-content:center;padding:0 10px;font-family:var(--sf);font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.dbar-r{justify-content:flex-end}
.sdot{width:5px;height:5px;border-radius:50%;flex-shrink:0;animation:dp 2.5s infinite}
@keyframes dp{0%,100%{opacity:.8}50%{opacity:.15}}
.sig{display:flex;align-items:flex-end;gap:2px;height:12px;flex-shrink:0}
.sig i{width:3px;border-radius:1px;display:block}
/* photo container */
.photo{position:relative;overflow:hidden;background:var(--box)}
.photo img{display:block}
.phpl{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-family:var(--mono);font-size:9px;letter-spacing:.18em}
/* grade badge */
.grd{font-family:var(--sf);font-weight:900;padding:3px 14px;border:none;border-top:1.5px solid;border-bottom:1.5px solid;font-size:14px;line-height:1.3;letter-spacing:.08em;display:inline-block;background:transparent;position:relative}

.grd-abs{position:absolute;top:14px;right:14px;z-index:8;font-size:13px;padding:2px 10px}
.nameov{position:absolute;bottom:0;left:0;right:0;z-index:6;padding:12px 13px 10px}
.code{font-family:var(--mono);font-size:10px;letter-spacing:.24em;margin-bottom:3px}
.name{font-weight:500;line-height:1.15;word-break:keep-all}
.role{font-size:11px;letter-spacing:.07em;margin-top:4px;word-break:keep-all}
.lbl{font-family:var(--mono);font-size:8px;letter-spacing:.26em;text-transform:uppercase;margin-bottom:5px;display:flex;align-items:center;gap:6px;opacity:.6}
.lbl::after{content:'';height:1px;flex:1;background:currentColor;opacity:.25}
.cel{border:1px solid var(--line2);background:var(--box);padding:12px;min-width:0;position:relative}
.cel::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:currentColor;opacity:.12}
.txta{font-size:13px;line-height:1.85;white-space:pre-wrap;word-break:keep-all}
.skname{font-weight:700;font-size:13px;margin-bottom:3px;letter-spacing:.04em}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.ptag{font-family:var(--mono);font-size:9px;padding:2px 10px;border:none;border-top:1px solid;border-bottom:1px solid;white-space:nowrap;letter-spacing:.04em;background:transparent;display:inline-block;position:relative}

.mrz{padding:6px 13px;border-top:1px solid var(--line2);font-family:var(--mono);font-size:9px;letter-spacing:.14em;line-height:1.75;flex-shrink:0;position:relative;z-index:3}
[data-theme="light"] .mrz{background:rgba(20,55,120,.04)}
.mrz-d{opacity:.4}.mrz-h{opacity:.9}
.foot{height:30px;border-top:1px solid var(--line2);display:flex;justify-content:space-between;align-items:center;padding:0 13px;font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;flex-shrink:0;position:relative;z-index:3}
/* SOLO V */
.solo-v{width:640px;display:flex;flex-direction:column}
.sv-hero{position:relative;height:520px;overflow:hidden;flex-shrink:0;border-bottom:1px solid var(--line2)}
.sv-hero .photo{position:absolute;inset:0}


.sv-hero .nameov{z-index:5}
.sv-hero .grd-abs{z-index:7}
.sv-acc-l{position:absolute;left:0;top:14px;width:2px;height:30px;opacity:.35;z-index:3}
.sv-acc-r{position:absolute;right:0;top:14px;width:2px;height:30px;opacity:.35;z-index:3}
.sv-info{display:flex;flex-direction:column;position:relative;z-index:3}
.sv-r2{display:grid;grid-template-columns:1fr 1fr}
.sv-r2 .cel{border-left:0;border-top:0}.sv-r2 .cel:last-child{border-right:0}
.sv-full{border-left:0;border-right:0;border-top:0}
/* SOLO H */
.solo-h{width:980px;display:flex;flex-direction:column}
.sh-body{display:grid;grid-template-columns:300px 1fr}
.sh-left{border-right:1px solid var(--line2);position:relative;overflow:hidden;min-height:540px}
.sh-left .photo{position:absolute;inset:0}


.sh-namepanel{position:absolute;bottom:0;left:0;right:0;z-index:5;padding:12px 14px 10px}
.sh-right{display:flex;flex-direction:column}
.sh-hud{height:40px;background:rgba(0,0,0,.1);border-bottom:1px solid var(--line2);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 12px;flex-shrink:0;position:relative;z-index:3}
[data-theme="light"] .sh-hud{background:rgba(20,55,120,.04)}
.sh-hud-l,.sh-hud-r{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;overflow:hidden;white-space:nowrap}
.sh-hud-r{justify-content:flex-end}
.sh-m2{display:grid;grid-template-columns:1fr 1fr}
.sh-m2 .cel{border-top:0;border-left:0}.sh-m2 .cel:nth-child(even){border-right:0}
.sh-full{border-left:0;border-right:0;border-top:0}
/* PAIR */
.pair{width:980px;display:flex;flex-direction:column}
.pair-tb{height:2px;position:relative;z-index:5;flex-shrink:0}
.pair-tb::after{content:'◈';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--sf);font-size:8px;text-shadow:0 0 8px currentColor;background:var(--paper);padding:0 4px;line-height:1}
.pair-dbar{height:40px;border-bottom:1px solid var(--line2);display:grid;grid-template-columns:1fr auto 1fr;background:rgba(0,0,0,.12);flex-shrink:0;position:relative;z-index:3}
[data-theme="light"] .pair-dbar{background:rgba(20,55,120,.04)}
.pda,.pdb,.pdc{display:flex;align-items:center;gap:6px;padding:0 12px;font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;overflow:hidden;white-space:nowrap}
.pdc{justify-content:center;color:var(--sub)}
.pdb{justify-content:flex-end}
.pair-body{border-bottom:1px solid var(--line2);flex-shrink:0}
.ucol{display:flex;flex-direction:column}
.ucol.a{border-right:1px solid var(--line2)}
.ucol.b{border-left:1px solid var(--line2)}
/* uphwrap: photo + info side by side */
.uphwrap{display:flex;gap:10px;padding:14px;border-bottom:1px solid var(--line2);align-items:flex-end;position:relative}
.uphoto{width:110px;height:150px;flex-shrink:0;position:relative;overflow:hidden;background:var(--box)}
.uphoto img{position:absolute;top:0;left:0;object-fit:cover}
.upinfo{display:flex;flex-direction:column;justify-content:flex-end;gap:3px;min-width:0;flex:1}
.ucells{display:flex;flex-direction:column;flex:1}
.ucel{padding:8px 12px;border-bottom:1px solid var(--line2);position:relative}
.ucel:last-child{border-bottom:none}
.ucel::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:currentColor;opacity:.12}
.pcenter{padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.chartbox{border:1px solid var(--line2);background:var(--box);display:grid;place-items:center;padding:7px;flex-shrink:0}
.rpoly{fill-opacity:.15;stroke-width:1.5}
.lbar{height:6px;border:1px solid var(--line2);flex-shrink:0}
.ccel{border:1px solid var(--line2);background:var(--box);padding:9px 11px;position:relative}
.ccel::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:currentColor;opacity:.15}
/* text align */
.ta-left .txta{text-align:left}
.ta-center .txta,.ta-center .name,.ta-center .role,.ta-center .code{text-align:center}
.ta-right .txta,.ta-right .name,.ta-right .role,.ta-right .code{text-align:right}
.ta-justify .txta{text-align:justify}

/* HERO IMAGE GRADIENT OVERLAY — 글씨 영역만 아주 좁게 덮는 테마 그라데이션 */
:root{
  --hero-grad:linear-gradient(
    to bottom,
    rgba(6,11,20,0) 0%,
    rgba(6,11,20,0) 78%,
    rgba(6,11,20,.22) 88%,
    rgba(6,11,20,.78) 100%
  );
}
[data-theme="dark"]{
  --hero-grad:linear-gradient(
    to bottom,
    rgba(6,11,20,0) 0%,
    rgba(6,11,20,0) 78%,
    rgba(6,11,20,.24) 88%,
    rgba(6,11,20,.84) 100%
  );
}
[data-theme="light"]{
  --hero-grad:linear-gradient(
    to bottom,
    rgba(255,255,255,0) 0%,
    rgba(255,255,255,0) 78%,
    rgba(244,247,253,.28) 88%,
    rgba(255,255,255,.86) 100%
  );
}
.hero-bg{position:absolute;inset:0;background-color:var(--box)}
.hero-bg::after{content:'';position:absolute;inset:0;pointer-events:none;background:var(--hero-grad);z-index:1}
.hero-bg .phpl{z-index:0}
.nameov,.sh-namepanel{z-index:5}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(8px);background:var(--side);border:1px solid #8b7cff;color:#8b7cff;font-family:var(--mono);font-size:9px;letter-spacing:.12em;padding:7px 15px;opacity:0;pointer-events:none;transition:.2s;z-index:999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
<aside class="sb">
  <div class="sb-head">
    <div class="brand">SGV FILE<small>CLASSIFIED DATABASE</small></div>
    <button class="ibtn" id="themeBtn">LIGHT</button>
  </div>
  <div class="moderow">
    <button class="mbtn" id="mSolo">1인용</button>
    <button class="mbtn" id="mPair">2인용</button>
  </div>
  <div class="chartabs" id="ctabs"></div>
  <div class="stbar" id="stbar">
    <button class="stbtn" id="stA">A</button>
    <button class="stbtn" id="stB">B</button>
    <button class="stbtn" id="stP">페어</button>
  </div>
  <div class="scroll"><div id="form"></div></div>
  <div class="btm">
    <div id="layBox">
      <div class="bt">레이아웃</div>
      <div class="layrow"><button class="lbtn" id="layV">세로형</button><button class="lbtn" id="layH">가로형</button></div>
    </div>
    <div>
      <div class="bt">텍스트 정렬</div>
      <div class="alrow"><button class="abtn" id="taL">L</button><button class="abtn" id="taC">C</button><button class="abtn" id="taR">R</button><button class="abtn" id="taJ">J</button></div>
    </div>
    <div>
      <div class="bt">카드 글씨색</div>
      <div class="cline"><input type="color" id="tcPick"/><span id="tcVal"></span><button class="ibtn" onclick="resetTc()" style="padding:3px 6px">↺</button></div>
    </div>
    <div>
      <div class="bt">글씨체</div>
      <select class="fsel" id="fontSel">
        <option value="'Noto Sans KR',sans-serif">Noto Sans KR (기본)</option>
        <option value="'Gothic A1',sans-serif">Gothic A1</option>
        <option value="'Gowun Dodum',sans-serif">Gowun Dodum</option>
        <option value="'Noto Serif KR',serif">Noto Serif KR (명조)</option>
        <option value="'Inter',sans-serif">Inter</option>
        <option value="'Exo 2',sans-serif">Exo 2</option>
        <option value="'Rajdhani',sans-serif">Rajdhani</option>
        <option value="'IBM Plex Mono',monospace">IBM Plex Mono</option>
      </select>
    </div>
    <div class="acrow">
      <button class="acbtn" id="cpBtn">이미지 복사</button>
      <button class="acbtn" id="pngBtn">PNG 저장</button>
    </div>
    <div class="acrow">
      <button class="acbtn" id="saveBtn">💾 데이터 저장</button>
      <button class="acbtn" id="loadBtn">📂 불러오기</button>
    </div>
    <input type="file" id="loadFile" accept=".json" style="display:none">
  </div>
</aside>
<main class="preview" id="preview"><div id="prev"></div></main>
</div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
let theme='dark',mode='solo',layout='v',active=0,sub='A';
let ta='left',font="'Noto Sans KR',sans-serif",tc='',tcCustom=false;

function mkCh(label,ac){
  return{label:label||'캐릭터',ac:ac||'#8b7cff',
    name:'',code:'',grade:'',type:'',org:'',dept:'',pos:'',tags:'',desc:'',
    img:'',is:1,ix:0,iy:0,extras:[],skills:[{id:1,name:'',desc:''}],_ec:0,_sc:1};
}
function mkPair(label){
  return{label:label||'페어',pc:'#5a6aff',pairId:'',pairName:'',synergy:98,pairComment:'',graphTextColor:'#7a9ab8',pairLayout:'full',strength:'',weakness:'',pairDesc:'',
    A:mkCh('A','#35bfff'),B:mkCh('B','#ff4d8d'),
    ct:'radar',
    stats:[{label:'동조율',value:80,color:'#35bfff'},{label:'정신 안정',value:100,color:'#8b7cff'},{label:'잠재 리스크',value:100,color:'#ff4d8d'},{label:'의존도',value:100,color:'#27d599'}]};
}
let solos=[mkCh('캐릭터 1')];
let pairs=[mkPair('페어 1')];

function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function v(s){return String(s||'').trim()}
function cur(){return mode==='solo'?solos[active]:pairs[active]}
function cch(){return sub==='A'?pairs[active].A:pairs[active].B}
function getObj(){return(mode==='pair'&&sub==='P')?cur():(mode==='solo'?solos[active]:cch())}
function toast(m,d){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),d||1800)}
function tcolor(){return tcCustom&&tc?tc:(theme==='dark'?'#c8d8e8':'#0c1c2c')}
function sigbars(c){return`<div class="sig">${[4,6,9,11,13].map((h,i)=>`<i style="height:${h}px;background:${c};opacity:${[.3,.5,.7,.85,1][i]}"></i>`).join('')}</div>`}
function ck4(ca,cb){cb=cb||ca;return`<i class="ck tl" style="border-color:${ca}"></i><i class="ck tr" style="border-color:${cb}"></i><i class="ck bl" style="border-color:${ca}"></i><i class="ck br" style="border-color:${cb}"></i>`}
const HEX=(()=>{const c='0123456789ABCDEF';let s='';for(let i=0;i<192;i++)s+=c[i*7%16];return s.match(/.{1,8}/g).slice(0,8).join('\n');})();

// background-image 방식 — html2canvas 완벽 호환 (object-position 미지원 우회)
function bgSt(img,is,ix,iy){
  const sc=Math.max(0.6,is||1);
  const bx=Math.max(0,Math.min(100,50+(ix||0)));
  const by=Math.max(0,Math.min(100,5+(iy||0)));
  return`background-image:url('${img}');background-size:${Math.round(sc*100)}%;background-position:${bx}% ${by}%;background-repeat:no-repeat`;
}
// THEME
function applyTheme(){
  document.documentElement.dataset.theme=theme;
  $('themeBtn').textContent=theme==='dark'?'LIGHT':'DARK';
  if(!tcCustom){tc=theme==='dark'?'#c8d8e8':'#0c1c2c';$('tcPick').value=tc;$('tcVal').textContent=tc;$('tcVal').style.color=tc;}
}
function resetTc(){tcCustom=false;applyTheme();render()}

// TABS
function buildTabs(){
  const arr=mode==='solo'?solos:pairs;
  $('ctabs').innerHTML='';
  arr.forEach((it,i)=>{
    const ac=mode==='solo'?it.ac:it.A.ac;
    const b=document.createElement('button');
    b.className='ctab'+(i===active?' on':'');
    b.style.cssText=`--ac:${ac};color:${i===active?ac:'var(--sub)'}`;
    b.innerHTML=esc(it.label||((mode==='solo'?'캐릭터 ':'페어 ')+(i+1)))+' <span class="x">×</span>';
    b.onclick=e=>{
      if(e.target.className==='x'){if(arr.length===1)return toast('마지막 탭은 삭제 불가');arr.splice(i,1);active=Math.min(active,arr.length-1);sub='A';rebuild();return;}
      active=i;sub='A';rebuild();
    };
    $('ctabs').appendChild(b);
  });
  const add=document.createElement('button');add.className='addtab';add.textContent='+';
  add.onclick=()=>{arr.push(mode==='solo'?mkCh('캐릭터 '+(arr.length+1)):mkPair('페어 '+(arr.length+1)));active=arr.length-1;sub='A';rebuild();};
  $('ctabs').appendChild(add);
}

// FORM HELPERS
function F(l,k,obj,t){return`<div class="f"><label>${l}</label><input type="${t||'text'}" data-k="${k}" value="${esc(obj[k]||'')}"></div>`}
function A(l,k,obj){return`<div class="f"><label>${l}</label><textarea data-k="${k}">${esc(obj[k]||'')}</textarea></div>`}
function C(l,k,obj){return`<div class="f"><label>${l}</label><div class="cline"><input type="color" data-k="${k}" value="${esc(obj[k]||'#8b7cff')}"><span>${esc(obj[k]||'#8b7cff')}</span></div></div>`}

function imgBoxHTML(obj,uid){
  const sliders=obj.img?`
    <div class="ictrl"><label>확대</label><input type="range" id="sl_is_${uid}" min="0.5" max="3" step="0.05" value="${obj.is||1}"><span id="sv_is_${uid}">${obj.is||1}×</span></div>
    <div class="ictrl"><label>좌우</label><input type="range" id="sl_ix_${uid}" min="-50" max="50" step="1" value="${obj.ix||0}"><span id="sv_ix_${uid}">${obj.ix||0}</span></div>
    <div class="ictrl"><label>상하</label><input type="range" id="sl_iy_${uid}" min="-20" max="80" step="1" value="${obj.iy||0}"><span id="sv_iy_${uid}">${obj.iy||0}</span></div>`:'';
  return`<div class="sec"><div class="sec-hd">IMAGE <span style="font-size:7px;opacity:.5">클릭하여 변경</span></div>
    <div class="imgbox" id="ib_${uid}">
      <input type="file" accept="image/*" id="if_${uid}" style="display:none">
      ${obj.img?`<img id="ibimg_${uid}" src="${obj.img}" style="width:100%;height:auto;display:block;position:relative">`:`<div class="imgbox-ph">IMAGE UPLOAD</div>`}
    </div>
    ${sliders}
  </div>`;
}

function charFormHTML(obj,uid){
  return`
  <div class="sec"><div class="sec-hd">색상 / 탭</div>
    ${C('포인트 색','ac',obj)}${F('탭 이름','label',obj)}
  </div>
  ${imgBoxHTML(obj,uid)}
  <div class="sec"><div class="sec-hd">PROFILE</div>
    ${F('이름','name',obj)}${F('코드네임','code',obj)}${F('등급','grade',obj)}
    ${F('타입 (센티넬/가이드 등)','type',obj)}
    ${F('소속','org',obj)}${F('부서','dept',obj)}${F('직책','pos',obj)}
    ${F('성격 키워드','tags',obj)}
    <div class="f"><label style="opacity:.5;font-size:7px">예: #냉철 #과묵 #집착형</label></div>
    ${A('캐릭터 소개','desc',obj)}
  </div>
  <div class="sec"><div class="sec-hd">추가 정보</div>
    <div id="ext_${uid}">${(obj.extras||[]).map((e,i)=>`<div class="entry" data-ei="${i}">
      <div class="etop"><b>FIELD ${i+1}</b><button class="rmbtn" data-erm="${i}">×</button></div>
      <div class="f"><label>항목명</label><input data-ek="label" value="${esc(e.label)}"></div>
      <div class="f"><label>내용</label><textarea data-ek="value">${esc(e.value)}</textarea></div>
    </div>`).join('')}</div>
    <button class="addbtn" id="addext_${uid}">+ 항목 추가</button>
  </div>
  <div class="sec"><div class="sec-hd">SKILLS</div>
    <div id="sk_${uid}">${obj.skills.map((s,i)=>`<div class="entry" data-si="${i}">
      <div class="etop"><b>SKILL ${i+1}</b><button class="rmbtn" data-srm="${i}">×</button></div>
      <div class="f"><label>스킬명</label><input data-sk="name" value="${esc(s.name)}"></div>
      <div class="f"><label>설명</label><textarea data-sk="desc">${esc(s.desc)}</textarea></div>
    </div>`).join('')}</div>
    <button class="addbtn" id="addsk_${uid}">+ 스킬 추가</button>
  </div>`;
}

function pairFormHTML(p){
  return`
  <div class="sec"><div class="sec-hd">페어 설정</div>
    ${F('탭 이름','label',p)}${C('틀 포인트 색','pc',p)}${F('페어 ID','pairId',p)}
    <div class="f"><label>레이아웃</label><div style="display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line)">
      <button type="button" onclick="(()=>{const p=cur();p.pairLayout='full';render()})()" style="border:0;border-right:1px solid var(--line);background:${p.pairLayout!=='simple'?'rgba(139,124,255,.15)':'transparent'};color:${p.pairLayout!=='simple'?'#8b7cff':'var(--sub)'};padding:7px;font-family:var(--mono);font-size:8px;cursor:pointer">그래프 포함</button>
      <button type="button" onclick="(()=>{const p=cur();p.pairLayout='simple';render()})()" style="border:0;background:${p.pairLayout==='simple'?'rgba(139,124,255,.15)':'transparent'};color:${p.pairLayout==='simple'?'#8b7cff':'var(--sub)'};padding:7px;font-family:var(--mono);font-size:8px;cursor:pointer">심플 (A+B만)</button>
    </div></div>
    ${F('페어명 (관계 유형)','pairName',p)}
    ${F('시너지율 (0-100)','synergy',p,'number')}
    ${A('페어 코멘트','pairComment',p)}

    <div class="f"><label>그래프 타입</label><select data-k="ct">
      <option value="radar"${p.ct==='radar'?' selected':''}>레이더</option>
      <option value="donut"${p.ct==='donut'?' selected':''}>도넛</option>
    </select></div>
    ${C('그래프 글씨색','graphTextColor',p)}
  </div>
  <div class="sec"><div class="sec-hd">STATUS GRAPH</div>
    <div id="stats">${p.stats.map((s,i)=>`<div class="entry" data-sti="${i}">
      <div class="etop"><b>STAT ${i+1}</b><button class="rmbtn" data-strm="${i}">×</button></div>
      <div class="f"><label>항목명</label><input data-stk="label" value="${esc(s.label)}"></div>
      <div class="f"><label>수치(0-100)</label><input type="number" min="0" max="100" data-stk="value" value="${s.value}"></div>
      <div class="f"><label>색</label><div class="cline"><input type="color" data-stcol="${i}" value="${s.color}"><span>${s.color}</span></div></div>
    </div>`).join('')}</div>
    <button class="addbtn" id="addstat">+ 항목 추가</button>
  </div>`;
}

let _rt=null;
function dr(){clearTimeout(_rt);_rt=setTimeout(render,16)}

function bindImg(uid,obj){
  const box=$('ib_'+uid),fi=$('if_'+uid);
  if(!box||!fi)return;
  box.onclick=()=>fi.click();
  fi.onchange=function(){
    const f=this.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=e=>{obj.img=e.target.result;obj.is=1;obj.ix=0;obj.iy=0;buildForm();render();};
    r.readAsDataURL(f);this.value='';
  };
  const sis=$('sl_is_'+uid),six=$('sl_ix_'+uid),siy=$('sl_iy_'+uid);
  if(sis)sis.oninput=function(){obj.is=+this.value;const s=$('sv_is_'+uid);if(s)s.textContent=this.value+'×';dr()};
  if(six)six.oninput=function(){obj.ix=+this.value;const s=$('sv_ix_'+uid);if(s)s.textContent=this.value;dr()};
  if(siy)siy.oninput=function(){obj.iy=+this.value;const s=$('sv_iy_'+uid);if(s)s.textContent=this.value;dr()};
}

function buildForm(){
  const uid=mode==='solo'?'solo':(sub==='A'?'pA':'pB');
  const obj=getObj();
  if(mode==='pair'&&sub==='P')$('form').innerHTML=pairFormHTML(cur());
  else $('form').innerHTML=charFormHTML(obj,uid);
  bindForm(obj,uid);
}

function bindForm(obj,uid){
  if(!obj){obj=getObj();uid=mode==='solo'?'solo':(sub==='A'?'pA':'pB');}
  $('form').querySelectorAll('[data-k]').forEach(el=>{
    el.oninput=()=>{
      const k=el.dataset.k;
      obj[k]=el.type==='number'?Number(el.value):el.value;
      if(el.type==='color'&&el.nextElementSibling)el.nextElementSibling.textContent=el.value;
      if(k==='ac'||k==='pc')buildTabs();
      el.type==='color'?dr():render();
    };
  });
  bindImg(uid,obj);
  $('form').querySelectorAll('[data-ek]').forEach(el=>{
    el.oninput=()=>{const i=+el.closest('[data-ei]').dataset.ei;(obj.extras=obj.extras||[])[i][el.dataset.ek]=el.value;render()};
  });
  $('form').querySelectorAll('[data-erm]').forEach(btn=>{
    btn.onclick=()=>{obj.extras.splice(+btn.dataset.erm,1);buildForm();render()};
  });
  const aext=$('addext_'+uid);
  if(aext)aext.onclick=()=>{obj._ec=(obj._ec||0)+1;(obj.extras=obj.extras||[]).push({id:obj._ec,label:'',value:''});buildForm();render()};
  $('form').querySelectorAll('[data-sk]').forEach(el=>{
    el.oninput=()=>{const i=+el.closest('[data-si]').dataset.si;obj.skills[i][el.dataset.sk]=el.value;render()};
  });
  $('form').querySelectorAll('[data-srm]').forEach(btn=>{
    btn.onclick=()=>{obj.skills.splice(+btn.dataset.srm,1);buildForm();render()};
  });
  const ask=$('addsk_'+uid);
  if(ask)ask.onclick=()=>{obj._sc=(obj._sc||0)+1;obj.skills.push({id:obj._sc,name:'',desc:''});buildForm();render()};
  if(mode==='pair'&&sub==='P'){
    const p=cur();
    $('form').querySelectorAll('[data-stk]').forEach(el=>{
      el.oninput=()=>{const i=+el.closest('[data-sti]').dataset.sti;p.stats[i][el.dataset.stk]=el.dataset.stk==='value'?Math.max(0,Math.min(100,Number(el.value)||0)):el.value;render()};
    });
    $('form').querySelectorAll('[data-stcol]').forEach(el=>{
      el.oninput=()=>{const i=+el.dataset.stcol;p.stats[i].color=el.value;if(el.nextElementSibling)el.nextElementSibling.textContent=el.value;dr()};
    });
    $('form').querySelectorAll('[data-strm]').forEach(btn=>{
      btn.onclick=()=>{p.stats.splice(+btn.dataset.strm,1);buildForm();render()};
    });
    const ast=$('addstat');
    if(ast)ast.onclick=()=>{p.stats.push({label:'',value:50,color:'#8b7cff'});buildForm();render()};
  }
}

// RENDER HELPERS
function photoEl(ch,w,h){
  const bg=ch.img?bgSt(ch.img,ch.is,ch.ix,ch.iy):'';
  return`<div class="photo" style="width:${w}px;height:${h}px;${bg}">${ch.img?'':`<div class="phpl">IMAGE</div>`}</div>`;
}
function gradeAbs(g,a){return v(g)?`<div class="grd grd-abs" style="color:${a};border-color:${a};text-shadow:0 0 8px ${a};background-image:linear-gradient(${a},${a}),linear-gradient(${a},${a}),linear-gradient(${a},${a}),linear-gradient(${a},${a});background-size:1.5px 25%,1.5px 25%,1.5px 25%,1.5px 25%;background-position:left top,left bottom,right top,right bottom;background-repeat:no-repeat">${esc(g)}</div>`:''}
function gradeInline(g,a){return v(g)?`<div class="grd" style="color:${a};border-color:${a};font-size:12px;padding:2px 8px;margin-top:5px;background-image:linear-gradient(${a},${a}),linear-gradient(${a},${a}),linear-gradient(${a},${a}),linear-gradient(${a},${a});background-size:1.5px 25%,1.5px 25%,1.5px 25%,1.5px 25%;background-position:left top,left bottom,right top,right bottom;background-repeat:no-repeat">${esc(g)}</div>`:''}
function tagsEl(tags,a){
  const t=v(tags).split(/\s+/).filter(Boolean);
  return t.length?`<div class="tags">${t.map(w=>`<span class="ptag" style="color:${a};border-color:${a};background-image:linear-gradient(${a},${a}),linear-gradient(${a},${a}),linear-gradient(${a},${a}),linear-gradient(${a},${a});background-size:1px 25%,1px 25%,1px 25%,1px 25%;background-position:left top,left bottom,right top,right bottom;background-repeat:no-repeat">${esc(w)}</span>`).join('')}</div>`:'';
}
function mrzEl(ch,a){
  if(!v(ch.name)&&!v(ch.grade))return'';
  const parts=[];
  if(v(ch.name))parts.push(`<span class="mrz-h">${esc(v(ch.name))}</span>`);
  if(v(ch.code))parts.push(`<span class="mrz-h">${esc(v(ch.code))}</span>`);
  parts.push(`<span class="mrz-d">SGV</span>`);
  if(v(ch.type))parts.push(`<span class="mrz-h">${esc(v(ch.type))}</span>`);
  if(v(ch.grade))parts.push(`<span class="mrz-h">${esc(v(ch.grade))}</span>`);
  return`<div class="mrz" style="color:${a}">${parts.join('<span class="mrz-d"> // </span>')}</div>`;
}
function skillsEl(ch,a,t,unit){
  const arr=ch.skills.filter(s=>v(s.name)||v(s.desc));
  if(!arr.length)return'';
  const cls=unit?'ucel':'sv-full cel';
  return arr.map(s=>`<div class="${cls}" style="color:${a}"><div class="lbl">SKILL</div>${v(s.name)?`<div class="skname" style="color:${a}">${esc(v(s.name))}</div>`:''}${v(s.desc)?`<div class="txta" style="color:${t}">${esc(v(s.desc))}</div>`:''}</div>`).join('');
}
function extrasEl(ch,a,t,unit){
  const arr=(ch.extras||[]).filter(e=>v(e.label)||v(e.value));
  if(!arr.length)return'';
  const cls=unit?'ucel':'sv-full cel';
  return arr.map(e=>`<div class="${cls}" style="color:${a}"><div class="lbl">${esc(v(e.label)||'INFO')}</div><div class="txta" style="color:${t}">${esc(v(e.value))}</div></div>`).join('');
}
function chart(p){
  const gtc=p.graphTextColor||'#7a9ab8';
  const stats=p.stats.filter(s=>v(s.label)||Number(s.value));
  const pc=p.pc||'#5a6aff';
  if(!stats.length)return`<div class="chartbox" style="min-height:140px"><div class="phpl">GRAPH</div></div>`;
  if(p.ct==='donut'){
    let total=stats.reduce((a,s)=>a+(Number(s.value)||0),0)||1,off=25;
    const seg=stats.map(s=>{const d=(Number(s.value)||0)/total*100,r=`<circle cx="110" cy="110" r="90" fill="none" stroke="${s.color}" stroke-width="16" stroke-dasharray="${d} ${100-d}" stroke-dashoffset="-${off}" pathLength="100" transform="rotate(-90 110 110)"/>`;off+=d;return r}).join('');
    return`<div class="chartbox" style="padding:8px 4px;width:100%"><div style="display:flex;flex-direction:column;align-items:center;gap:10px;width:100%"><svg width="220" height="220" viewBox="0 0 220 220" style="display:block">${seg}</svg><div style="font-size:11px;line-height:1.7;text-align:left">${stats.map(s=>`<div style="display:flex;align-items:center;gap:5px;margin:2px 0"><i style="width:8px;height:8px;background:${s.color};display:inline-block;flex-shrink:0;border-radius:1px"></i><span style="font-family:var(--mono);font-size:10px;color:${gtc}">${esc(s.label)} ${Number(s.value)||0}</span></div>`).join('')}</div></div></div>`;
  }
  const n=stats.length,cx=185,cy=185,R=130;
  let g='',pts=[];
  for(let gr=1;gr<=4;gr++){const rr=R*gr/4,ps=[];for(let i=0;i<n;i++){const ang=-Math.PI/2+2*Math.PI*i/n;ps.push(`${cx+Math.cos(ang)*rr},${cy+Math.sin(ang)*rr}`)}g+=`<polygon points="${ps.join(' ')}" fill="none" stroke="var(--line2)" stroke-width="0.8"/>`}
  stats.forEach((s,i)=>{const ang=-Math.PI/2+2*Math.PI*i/n,vv=Math.max(0,Math.min(100,Number(s.value)||0));pts.push(`${cx+Math.cos(ang)*R*vv/100},${cy+Math.sin(ang)*R*vv/100}`);g+=`<line x1="${cx}" y1="${cy}" x2="${cx+Math.cos(ang)*R}" y2="${cy+Math.sin(ang)*R}" stroke="var(--line2)" stroke-width="0.8"/>`;const lx=cx+Math.cos(ang)*(R+38),ly=cy+Math.sin(ang)*(R+38);g+=`<text x="${lx}" y="${ly}" text-anchor="middle" style="font-family:var(--mono);font-size:11px;fill:${gtc}">${esc(s.label)}</text><text x="${lx}" y="${ly+13}" text-anchor="middle" style="font-family:var(--mono);font-size:10px;fill:${gtc};opacity:.75">${vv}</text>`;});
  return`<div class="chartbox" style="padding:8px 4px;width:100%"><svg width="100%" viewBox="0 0 370 370" style="max-width:380px;display:block;margin:0 auto">${g}<polygon class="rpoly" style="fill:${pc};stroke:${pc}" points="${pts.join(' ')}"/></svg></div>`;
}

// CARD RENDERERS
function soloV(ch){
  const a=ch.ac||'#8b7cff',t=tcolor(),f=font;
  return`<div class="doc solo-v ta-${ta}" style="--ap:${a};font-family:${f};border:1px solid ${a}">
    <div class="hexbg" style="color:${a}">${HEX}</div>
    ${ck4(a)}
    <div class="topbar" style="background:${a};box-shadow:0 0 16px ${a}"></div>
    <div class="dbar">
      <div class="dbar-l" style="color:${a}"><div class="sdot" style="background:${a}"></div>ACCESS GRANTED</div>
      <div class="dbar-c" style="color:${a}">CLEARANCE ${esc(v(ch.grade)||'--')}</div>
      <div class="dbar-r" style="color:${a}">${sigbars(a)}LINK:OK</div>
    </div>
    <div class="sv-hero">
      <div class="sv-acc-l" style="background:${a}"></div>
      <div class="sv-acc-r" style="background:${a}"></div>
      ${gradeAbs(ch.grade,a)}
      <div class="hero-bg" style="${ch.img?bgSt(ch.img,ch.is,ch.ix,ch.iy):''}">${ch.img?'':`<div class="phpl">IMAGE</div>`}</div>
      <div class="nameov">
        ${v(ch.code)?`<div class="code" style="color:${a}">&gt; ${esc(v(ch.code))}</div>`:''}
        ${v(ch.name)?`<div class="name" style="color:${t};font-size:27px">${esc(v(ch.name))}</div>`:''}
        ${(v(ch.org)||v(ch.pos))?`<div class="role" style="color:${a}">${[v(ch.org),v(ch.pos)].filter(Boolean).map(esc).join(' · ')}</div>`:''}
      </div>
    </div>
    ${mrzEl(ch,a)}
    <div class="sv-info">
      ${(v(ch.org)||v(ch.dept))?`<div class="sv-r2">${v(ch.org)?`<div class="cel" style="color:${a};border-left:0;border-top:0"><div class="lbl">AFFILIATION</div><div class="txta" style="color:${t}">${esc(v(ch.org))}</div></div>`:''} ${v(ch.dept)?`<div class="cel" style="color:${a};border-left:0;border-top:0;border-right:0"><div class="lbl">DEPARTMENT</div><div class="txta" style="color:${t}">${esc(v(ch.dept))}</div></div>`:''}</div>`:''}
      ${v(ch.type)?`<div class="sv-full cel" style="color:${a}"><div class="lbl">TYPE</div><div style="font-family:var(--sf);font-size:15px;font-weight:700;letter-spacing:.1em;color:${a}">${esc(v(ch.type))}</div></div>`:''}
      ${v(ch.pos)?`<div class="sv-full cel" style="color:${a}"><div class="lbl">POSITION</div><div class="txta" style="color:${t}">${esc(v(ch.pos))}</div></div>`:''}
      ${v(ch.tags)?`<div class="sv-full cel" style="color:${a}"><div class="lbl">PERSONALITY</div>${tagsEl(ch.tags,a)}</div>`:''}
      ${extrasEl(ch,a,t,false)}
      ${v(ch.desc)?`<div class="sv-full cel" style="color:${a}"><div class="lbl">BIOGRAPHY</div><div class="txta" style="color:${t}">${esc(v(ch.desc))}</div></div>`:''}
      ${skillsEl(ch,a,t,false)}
    </div>
    <div class="foot" style="color:var(--sub)"><span>AUTHORIZED PERSONNEL ONLY</span><span><span class="sdot" style="background:${a};margin-right:5px"></span>AUTHORIZED ONLY</span></div>
  </div>`;
}

function soloH(ch){
  const a=ch.ac||'#8b7cff',t=tcolor(),f=font;
  return`<div class="doc solo-h ta-${ta}" style="--ap:${a};font-family:${f};border:1px solid ${a}">
    <div class="hexbg" style="color:${a}">${HEX}</div>
    ${ck4(a)}
    <div class="topbar" style="background:${a};box-shadow:0 0 16px ${a}"></div>
    <div class="sh-body">
      <div class="sh-left">
        ${gradeAbs(ch.grade,a)}
        <div class="hero-bg" style="${ch.img?bgSt(ch.img,ch.is,ch.ix,ch.iy):''}">${ch.img?'':`<div class="phpl">IMAGE</div>`}</div>
        <div class="sh-namepanel">
          ${v(ch.code)?`<div class="code" style="color:${a}">&gt; ${esc(v(ch.code))}</div>`:''}
          ${v(ch.name)?`<div class="name" style="color:${t};font-size:23px;margin-top:3px">${esc(v(ch.name))}</div>`:''}
          ${(v(ch.org)||v(ch.pos))?`<div class="role" style="color:${a}">${[v(ch.org),v(ch.pos)].filter(Boolean).map(esc).join(' · ')}</div>`:''}
        </div>
      </div>
      <div class="sh-right">
        <div class="sh-hud">
          <div class="sh-hud-l" style="color:${a}"><div class="sdot" style="background:${a}"></div>ACCESS GRANTED</div>
          <div></div>
          <div class="sh-hud-r" style="color:${a}">${sigbars(a)}LINK:OK</div>
        </div>
        ${(v(ch.org)||v(ch.dept))?`<div class="sh-m2">${v(ch.org)?`<div class="cel" style="color:${a};border-top:0;border-left:0"><div class="lbl">AFFILIATION</div><div class="txta" style="color:${t}">${esc(v(ch.org))}</div></div>`:''} ${v(ch.dept)?`<div class="cel" style="color:${a};border-top:0;border-left:0;border-right:0"><div class="lbl">DEPARTMENT</div><div class="txta" style="color:${t}">${esc(v(ch.dept))}</div></div>`:''}</div>`:''}
        ${v(ch.type)?`<div class="sh-full cel" style="color:${a}"><div class="lbl">TYPE</div><div style="font-family:var(--sf);font-size:15px;font-weight:700;letter-spacing:.1em;color:${a}">${esc(v(ch.type))}</div></div>`:''}
        ${v(ch.pos)?`<div class="sh-full cel" style="color:${a}"><div class="lbl">POSITION</div><div class="txta" style="color:${t}">${esc(v(ch.pos))}</div></div>`:''}
        ${v(ch.tags)?`<div class="sh-full cel" style="color:${a}"><div class="lbl">PERSONALITY</div>${tagsEl(ch.tags,a)}</div>`:''}
        ${extrasEl(ch,a,t,false)}
        ${v(ch.desc)?`<div class="sh-full cel" style="color:${a}"><div class="lbl">BIOGRAPHY</div><div class="txta" style="color:${t}">${esc(v(ch.desc))}</div></div>`:''}
        ${skillsEl(ch,a,t,false)}
      </div>
    </div>
    ${mrzEl(ch,a)}
    <div class="foot" style="color:var(--sub)"><span>DOCUMENT ID: ${esc(v(ch.code)||'--')}</span><span>AUTHORIZED PERSONNEL ONLY</span></div>
  </div>`;
}

function pairDoc(p){
  const pa=p.A.ac||'#35bfff',pb=p.B.ac||'#ff4d8d',pc=p.pc||'#5a6aff',t=tcolor(),f=font;
  function ucol(ch,side){
    const ca=side==='a'?pa:pb;
    return`<div class="ucol ${side}" style="--ap:${ca}">
      <div class="uphwrap">
        ${gradeAbs(ch.grade,ca)}
        <div class="uphoto">
          ${ch.img?`<img src="${ch.img}" style="position:absolute;max-width:100%;max-height:100%;width:auto;height:auto;top:50%;left:50%;transform:translate(calc(-50% + ${ch.ix||0}px),calc(-50% + ${ch.iy||0}px)) scale(${ch.is||1})">`:`<div class="phpl" style="font-size:8px">IMG</div>`}
        </div>
        <div class="upinfo">
          ${v(ch.code)?`<div class="code" style="color:${ca};font-size:9px">&gt; ${esc(v(ch.code))}</div>`:''}
          ${v(ch.name)?`<div class="name" style="color:${t};font-size:17px">${esc(v(ch.name))}</div>`:''}
          ${v(ch.org)||v(ch.pos)?`<div class="role" style="color:${ca}">${[v(ch.org),v(ch.pos)].filter(Boolean).map(esc).join(' · ')}</div>`:''}
        </div>
      </div>
      <div class="ucells">
        ${v(ch.type)?`<div class="ucel" style="color:${ca}"><div class="lbl">TYPE</div><div style="font-family:var(--sf);font-size:13px;font-weight:700;letter-spacing:.1em;color:${ca}">${esc(v(ch.type))}</div></div>`:''}
        ${v(ch.dept)?`<div class="ucel" style="color:${ca}"><div class="lbl">DEPARTMENT</div><div class="txta" style="font-size:12px;color:${t}">${esc(v(ch.dept))}</div></div>`:''}
        ${v(ch.tags)?`<div class="ucel" style="color:${ca}"><div class="lbl">PERSONALITY</div>${tagsEl(ch.tags,ca)}</div>`:''}
        ${extrasEl(ch,ca,t,true)}
        ${v(ch.desc)?`<div class="ucel" style="color:${ca}"><div class="lbl">BIOGRAPHY</div><div class="txta" style="font-size:12px;color:${t}">${esc(v(ch.desc))}</div></div>`:''}
        ${skillsEl(ch,ca,t,true)}
      </div>
    </div>`;
  }
  return`<div class="doc pair ta-${ta}" style="--ap:${pc};font-family:${f};border:1px solid rgba(139,124,255,.15)">
    <div class="hexbg" style="color:${pc}">${HEX}</div>
    <i class="ck tl" style="border-color:${pa}"></i><i class="ck tr" style="border-color:${pb}"></i>
    <i class="ck bl" style="border-color:${pa}"></i><i class="ck br" style="border-color:${pb}"></i>
    <div class="pair-tb" style="background:linear-gradient(90deg,${pa},${pc},${pb});color:${pc};box-shadow:0 0 12px ${pc}"></div>
    <div class="pair-dbar">
      <div class="pda" style="color:${pa}"><div class="sdot" style="background:${pa}"></div>${esc(v(p.A.code)||'--')}</div>
      <div class="pdc">// ${esc(v(p.pairId)||'PAIR FILE')} //</div>
      <div class="pdb" style="color:${pb}">${esc(v(p.B.code)||'--')}<div class="sdot" style="background:${pb}"></div></div>
    </div>
    <div class="pair-body" style="display:grid;grid-template-columns:${p.pairLayout==='simple'?'1fr 1fr':'1fr 280px 1fr'};border-bottom:1px solid var(--line2);flex-shrink:0">
      ${ucol(p.A,'a')}
      ${p.pairLayout!=='simple'?`<div class="pcenter" style="padding:16px 10px;gap:10px;display:flex;flex-direction:column;align-items:center">
        ${chart(p)}
        ${v(p.pairName)?`<div style="text-align:center;padding:7px 16px;border-top:1px solid ${pc};border-bottom:1px solid ${pc};width:100%">
          <div style="font-family:var(--sf);font-size:15px;font-weight:700;color:${pc};letter-spacing:.1em">${esc(v(p.pairName))}</div>
        </div>`:''}
        ${v(p.pairComment)?`<div style="width:100%;text-align:center">
          <div style="font-family:var(--mono);font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:${pc};opacity:.6;margin-bottom:8px">PAIR COMMENT</div>
          <div style="font-size:12px;line-height:1.9;color:${tcolor()};word-break:keep-all">&ldquo;${esc(v(p.pairComment))}&rdquo;</div>
        </div>`:''}
      </div>`:''}
      ${ucol(p.B,'b')}
    </div>
    <div class="foot" style="color:var(--sub)"><span>DOCUMENT ID: ${esc(v(p.pairId)||'--')}</span><span>AUTHORIZED PERSONNEL ONLY</span></div>
  </div>`;
}

function render(){
  $('prev').innerHTML=mode==='solo'?(layout==='v'?soloV(solos[active]):soloH(solos[active])):pairDoc(pairs[active]);
}

function rebuild(){
  $('mSolo').classList.toggle('on',mode==='solo');
  $('mPair').classList.toggle('on',mode==='pair');
  $('stbar').style.display=mode==='pair'?'grid':'none';
  ['A','B','P'].forEach(x=>$('st'+x).classList.toggle('on',sub===x));
  $('layBox').style.display=mode==='solo'?'block':'none';
  $('layV').classList.toggle('on',layout==='v');
  $('layH').classList.toggle('on',layout==='h');
  ['L','C','R','J'].forEach(x=>$('ta'+x).classList.toggle('on',ta===x.toLowerCase()));
  buildTabs();buildForm();render();
}

$('themeBtn').onclick=()=>{theme=theme==='dark'?'light':'dark';applyTheme();render()};
$('mSolo').onclick=()=>{mode='solo';active=0;rebuild()};
$('mPair').onclick=()=>{mode='pair';active=0;sub='A';rebuild()};
$('layV').onclick=()=>{layout='v';rebuild()};
$('layH').onclick=()=>{layout='h';rebuild()};
$('stA').onclick=()=>{sub='A';rebuild()};
$('stB').onclick=()=>{sub='B';rebuild()};
$('stP').onclick=()=>{sub='P';rebuild()};
$('taL').onclick=()=>{ta='left';rebuild()};
$('taC').onclick=()=>{ta='center';rebuild()};
$('taR').onclick=()=>{ta='right';rebuild()};
$('taJ').onclick=()=>{ta='justify';rebuild()};
$('fontSel').onchange=e=>{font=e.target.value;render()};
$('tcPick').oninput=function(){tc=this.value;tcCustom=true;$('tcVal').textContent=this.value;$('tcVal').style.color=this.value;dr()};

// PNG EXPORT
async function capPNG(){
  const node=$('prev').firstElementChild;
  if(!node)return null;
  const bg=theme==='dark'?'#060b14':'#ffffff';
  return html2canvas(node,{backgroundColor:bg,scale:5,useCORS:true,allowTaint:true,logging:false,width:node.scrollWidth,height:node.scrollHeight});
}
$('pngBtn').onclick=async()=>{
  toast('저장 중...',3000);
  try{const c=await capPNG();if(!c){toast('저장 실패');return}
    const a=document.createElement('a');
    const nm=(mode==='solo'?solos[active].label:pairs[active].label)||'sgv';
    a.download=nm+'_'+Date.now()+'.png';a.href=c.toDataURL('image/png');a.click();
    toast('PNG 저장 완료 ✓');
  }catch(e){toast('오류: '+e.message);console.error(e)}
};
$('cpBtn').onclick=async()=>{
  toast('처리 중...',3000);
  try{const c=await capPNG();if(!c){toast('실패');return}
    c.toBlob(async b=>{
      try{await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);toast('이미지 복사 완료 ✓')}
      catch{const a=document.createElement('a');a.download='sgv.png';a.href=c.toDataURL('image/png');a.click();toast('복사 불가 → 파일 저장')}
    },'image/png');
  }catch(e){toast('오류: '+e.message)}
};

// DATA SAVE / LOAD
$('saveBtn').onclick=()=>{
  const data=JSON.stringify({version:3,theme,layout,ta,font,tc,tcCustom,solos,pairs},null,2);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));
  a.download='sgv-data-'+Date.now()+'.json';a.click();
  toast('데이터 저장 완료 ✓');
};
$('loadBtn').onclick=()=>$('loadFile').click();
$('loadFile').onchange=function(){
  const f=this.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(d.theme)theme=d.theme;
      if(d.layout)layout=d.layout;
      if(d.ta)ta=d.ta;
      if(d.font)font=d.font;
      if(d.tc!==undefined)tc=d.tc;
      if(d.tcCustom!==undefined)tcCustom=d.tcCustom;
      if(d.solos)solos=d.solos.map(c=>Object.assign(mkCh(),c));
      if(d.pairs)pairs=d.pairs.map(p=>Object.assign(mkPair(),{...p,graphTextColor:p.graphTextColor||'#7a9ab8',A:Object.assign(mkCh(),p.A),B:Object.assign(mkCh(),p.B)}));
      active=0;sub='A';applyTheme();rebuild();
      toast('불러오기 완료 ✓');
    }catch(err){toast('파일 오류: '+err.message)}
  };
  r.readAsText(f);this.value='';
};

applyTheme();rebuild();
</script>
</body>
</html>
