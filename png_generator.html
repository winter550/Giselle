<script>
async function savePng(){

if(document.fonts){
await document.fonts.ready;
}

const canvas=await html2canvas(
capture,
{
backgroundColor:null,

/* 저장 크기 */
scale:1,

useCORS:true,

logging:false
}
);

const link=
document.createElement("a");

link.download=
`quote-${Date.now()}.png`;

link.href=
canvas.toDataURL(
"image/png"
);

link.click();

}
</script>
